<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5C56">
<title>Sơn Study OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEEDE8; --surface:#FFFFFF; --surface2:#F6F5F1; --line:#DEDCD4; --line2:#EAE8E2;
  --ink:#16191C; --ink2:#4B545C; --ink3:#7E888F;
  --accent:#1D5C56; --accent-ink:#0F3E39; --accent-soft:#D9E8E4;
  --red:#A5372A; --red-soft:#F6DFDA; --amber:#9C6410; --amber-soft:#F7E9CF;
  --green:#3B7239; --green-soft:#DFEDDB; --blue:#2C5A86; --blue-soft:#DCE7F1;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 6px 18px rgba(20,24,28,.05);
  --r:14px; --r-sm:9px;
  --f-ui:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#171B20; --surface2:#1D2329; --line:#2A3139; --line2:#232930;
  --ink:#E9EBE7; --ink2:#A7B0B7; --ink3:#78828A;
  --accent:#5FC2B2; --accent-ink:#8FDCCE; --accent-soft:#16302D;
  --red:#E8796A; --red-soft:#33201D; --amber:#DEA854; --amber-soft:#312712;
  --green:#7DC073; --green-soft:#1B2C1A; --blue:#79ADDD; --blue-soft:#182634;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B20; --surface2:#1D2329; --line:#2A3139; --line2:#232930;
  --ink:#E9EBE7; --ink2:#A7B0B7; --ink3:#78828A;
  --accent:#5FC2B2; --accent-ink:#8FDCCE; --accent-soft:#16302D;
  --red:#E8796A; --red-soft:#33201D; --amber:#DEA854; --amber-soft:#312712;
  --green:#7DC073; --green-soft:#1B2C1A; --blue:#79ADDD; --blue-soft:#182634;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px calc(10px) 16px}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:11.5px;color:var(--ink3);font-weight:500}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);border:1px solid transparent}
.icon-btn:hover{background:var(--surface2);border-color:var(--line)}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);font-weight:600;padding:4px 9px;border-radius:20px;background:var(--surface2);border:1px solid var(--line)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink3);display:block}
.sync.ok i{background:var(--green)}.sync.saving i{background:var(--amber)}.sync.local i{background:var(--blue)}

main{max-width:820px;margin:0 auto;padding:16px 16px 40px}
section.view{display:none;animation:fade .18s ease-out}
section.view.on{display:block}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:11px;color:var(--ink3);font-size:10.5px;font-weight:600}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .glyph{background:var(--accent-soft)}
.glyph{width:44px;height:26px;border-radius:9px;display:grid;place-items:center;transition:background .15s}
@media(min-width:821px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:57px;bottom:auto;max-width:820px;margin:0 auto;border-top:none;border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--bg) 88%, transparent);padding:6px 8px;gap:2px}
  nav.tabs button{flex-direction:row;gap:7px;font-size:13px;padding:8px 12px}
  nav.tabs button .glyph{width:auto;height:auto;background:none!important}
  nav.tabs button.on{background:var(--accent-soft)}
  main{padding-top:20px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:12px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h .act{font-size:12.5px;font-weight:600;color:var(--accent)}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0F1216}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.ghost{background:none;border-color:var(--line)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:7px 9px;font-size:12.5px;border-radius:8px}
.btn.sm svg{width:14px;height:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
textarea{min-height:74px;resize:vertical;line-height:1.45}
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- deadline ledger ---------- */
.ledger{display:flex;flex-direction:column;gap:8px}
.dl{position:relative;display:flex;gap:12px;padding:13px 14px 13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%}
.dl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink3)}
.dl.s-red::before{background:var(--red)} .dl.s-amber::before{background:var(--amber)}
.dl.s-green::before{background:var(--green)} .dl.s-done::before{background:var(--line)}
.dl.s-done{opacity:.55}
.dl-main{flex:1;min-width:0}
.dl-t{font-weight:700;font-size:14.5px;line-height:1.35;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dl-sub{font-size:12px;color:var(--ink3);margin-top:3px;font-weight:500}
.dl-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.cd{font-family:var(--f-num);font-size:19px;font-weight:700;line-height:1;letter-spacing:-.03em}
.cd small{font-size:10px;font-weight:500;color:var(--ink3);display:block;text-align:right;margin-top:3px;letter-spacing:.04em;font-family:var(--f-ui)}
.cd.red{color:var(--red)}.cd.amber{color:var(--amber)}.cd.green{color:var(--green)}
.w-badge{font-family:var(--f-num);font-weight:700;font-size:12px;padding:2px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.w-badge.big{background:var(--accent);color:#fff;border-color:transparent}
:root[data-theme="dark"] .w-badge.big,:root:not([data-theme="light"]) .w-badge.big{color:#0F1216}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .w-badge.big{color:#fff}}

/* ---------- checklist ---------- */
.ck{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line2)}
.ck:last-child{border-bottom:none}
.box{flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;margin-top:1px;color:transparent}
.box svg{width:13px;height:13px}
.ck.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .ck.done .box,:root:not([data-theme="light"]) .ck.done .box{color:#0F1216}
.ck.done .ck-t{text-decoration:line-through;color:var(--ink3)}
.ck-t{font-size:13.8px;font-weight:500;line-height:1.4}
.ck-s{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:20px;background:var(--surface2);overflow:hidden;display:flex;border:1px solid var(--line2)}
.bar i{display:block;height:100%}
.bar.tall{height:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:8px;height:8px;border-radius:3px;display:block}

/* ---------- day / week ---------- */
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day + .day{margin-top:10px}
.day-h{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.day-h b{font-size:13px;font-weight:700}
.day-h .d-num{font-family:var(--f-num);font-size:12px;color:var(--ink3);font-weight:600}
.day.today .day-h{background:var(--accent-soft)}
.day.today .day-h b{color:var(--accent)}
.blk{display:flex;gap:11px;padding:10px 14px;align-items:flex-start;border-bottom:1px solid var(--line2)}
.blk:last-child{border-bottom:none}
.blk-t{font-family:var(--f-num);font-size:11.5px;font-weight:700;color:var(--ink3);width:44px;flex-shrink:0;padding-top:2px}
.blk-b{flex:1;min-width:0}
.blk-n{font-weight:600;font-size:13.6px;line-height:1.35}
.blk-d{font-size:11.5px;color:var(--ink3);margin-top:2px}
.blk.fixed{background:linear-gradient(90deg,var(--blue-soft),transparent 60%)}
.tag{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:middle;flex-shrink:0}
.empty{padding:16px 14px;color:var(--ink3);font-size:12.5px;text-align:center}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:13px 12px}
.stat b{display:block;font-family:var(--f-num);font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat.red b{color:var(--red)}.stat.green b{color:var(--green)}.stat.amber b{color:var(--amber)}

/* ---------- sheet / modal ---------- */
.back{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:90;display:none;align-items:flex-end;justify-content:center}
.back.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .2s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
@media(min-width:700px){.back{align-items:center}.sheet{border-radius:18px;max-height:84vh}}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:3px}
.sheet .sh-sub{font-size:12.5px;color:var(--ink3);margin-bottom:15px}
.sheet-foot{display:flex;gap:9px;margin-top:16px}
.sheet-foot .btn{flex:1}

/* ---------- misc ---------- */
.note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.3px}
.kv:last-child{border-bottom:none}
.kv b{font-family:var(--f-num);font-weight:700}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 11px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.pill.on{background:var(--accent);border-color:transparent;color:#fff}
:root[data-theme="dark"] .pill.on,:root:not([data-theme="light"]) .pill.on{color:#0F1216}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .pill.on{color:#fff}}
.hero-num{font-family:var(--f-num);font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:1}
.spark{display:flex;align-items:flex-end;gap:4px;height:44px}
.spark i{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.spark i.last{background:var(--accent)}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:0 8px 7px 0;font-weight:700}
table.grid td{padding:9px 8px 9px 0;border-top:1px solid var(--line2);vertical-align:top}
table.grid td.n{font-family:var(--f-num);text-align:right;padding-right:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.subject-dot{width:9px;height:9px;border-radius:3px;display:inline-block}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
details.acc + details.acc{margin-top:9px}
details.acc > summary{padding:13px 15px;cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;list-style:none}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"⌄";margin-left:auto;color:var(--ink3);font-size:16px;transform:translateY(-3px)}
details.acc[open] > summary::after{transform:rotate(180deg) translateY(1px)}
details.acc .acc-b{padding:0 15px 14px}
.progress-ring{display:flex;align-items:center;gap:12px}
/* ---------- habits ---------- */
.habits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 10px;text-align:center}
.hab.on{background:var(--accent-soft);border-color:transparent}
.hab b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.hab.on b{color:var(--accent)}
.hab span{font-size:10.5px;color:var(--ink3);font-weight:600;display:block}
.hab .tick{font-family:var(--f-num);font-size:16px;font-weight:700;line-height:1;margin-bottom:4px;color:var(--ink3)}
.hab.on .tick{color:var(--accent)}
/* ---------- track head ---------- */
.trk{display:flex;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line2)}
.trk .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.trk b{font-size:14.5px;font-weight:700;display:block}
.trk span{font-size:11.5px;color:var(--ink3);font-weight:600}
/* ---------- roadmap ---------- */
.rm{position:relative;padding-left:22px}
.rm::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.rmi{position:relative;padding:0 0 18px 0}
.rmi::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink3)}
.rmi.now::before{background:var(--accent);border-color:var(--accent)}
.rmi h4{margin:0;font-size:13.5px;font-weight:700}
.rmi .when{font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rmi p{margin:4px 0 0;font-size:12.8px;color:var(--ink2);line-height:1.5}
.warnbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--ink)}
.warnbox b{color:var(--amber)}
/* ---------- day rail / timeline ---------- */
.rail{position:relative}
.slot{display:flex;gap:10px;align-items:stretch;min-height:38px;border-top:1px dashed var(--line2)}
.slot:first-child{border-top:none}
.slot .hr{width:42px;flex-shrink:0;font-family:var(--f-num);font-size:11px;color:var(--ink3);font-weight:600;padding-top:6px}
.slot .body{flex:1;min-width:0;padding:4px 0 4px 0;display:flex;flex-direction:column;gap:5px}
.slot.drop-on{background:var(--accent-soft)}
.gap-btn{width:100%;text-align:left;font-size:11.5px;color:var(--ink3);font-weight:600;padding:5px 8px;border-radius:8px;border:1px dashed var(--line);background:none}
.gap-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- compact row list (v6.1) ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list + .list{margin-top:10px}
.rowit{display:flex;gap:11px;align-items:center;padding:12px 13px;border-top:1px solid var(--line2);position:relative}
.rowit:first-child{border-top:none}
.rowit::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--c,transparent)}
.tick{width:27px;height:27px;border-radius:9px;border:1.6px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:transparent;background:var(--surface2)}
.tick svg{width:15px;height:15px}
.rowit.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .rowit.done .tick,:root:not([data-theme="light"]) .rowit.done .tick{color:#0F1216}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .rowit.done .tick{color:#fff}}
.rowit.done{opacity:.55}
.rowit.done .rt b{text-decoration:line-through;color:var(--ink3)}
.tm{font-family:var(--f-num);font-size:13px;font-weight:700;color:var(--ink2);width:42px;flex-shrink:0}
.rt{flex:1;min-width:0;cursor:pointer}
.rt b{font-weight:600;font-size:15px;line-height:1.35;display:block}
.rt .sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.rowit.cls{background:var(--blue-soft)}
.rowit.cls::before{background:var(--blue)}
.rowit.emg{background:var(--red-soft)}
.rowit.rest{opacity:.6}
.rowit.mac{background:linear-gradient(90deg,rgba(138,106,31,.10),transparent 55%)}
.mblk{margin-bottom:12px;font-size:13.5px;line-height:1.55}
.mlab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.mq{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:6px;font-size:13px;font-style:italic}
.mblk.out{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.mblk.out b{font-weight:700}
.rowit.dl{background:var(--red-soft)}
.rowit.dl::before{background:var(--red)}
.rowit.dragging{opacity:.4}
.dprog{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--line)}
.dprog b{font-family:var(--f-num);font-size:14px;font-weight:700;white-space:nowrap}
.dprog .bar{flex:1}
/* collapsible day */
.dayhead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.dayhead b{font-size:15px;font-weight:700}
.dayhead .dn2{font-family:var(--f-num);font-size:13px;color:var(--ink3);font-weight:600}
.dayhead .cnt{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:7px}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:2px;display:block}
.daybox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.daybox + .daybox{margin-top:8px}
.daybox.today{border-color:var(--accent)}
.daybox.today .dayhead{background:var(--accent-soft)}
.daybox.today .dayhead b{color:var(--accent)}
.daybox.drop-on{border-color:var(--accent);background:var(--accent-soft)}
.hchips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.hchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.25;text-align:center}
.hchip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.hchip .s{font-family:var(--f-num);font-size:11px;opacity:.75;font-weight:700}
.topline{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
.topline .big{font-family:var(--f-num);font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1}
.foldline{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:13.5px;font-weight:600}
/* ---------- item card ---------- */
.it{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);position:relative;cursor:grab}
.it.dragging{opacity:.45}
.it::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--c,var(--ink3))}
.it-b{flex:1;min-width:0;padding-left:5px}
.it-t{font-weight:600;font-size:13.6px;line-height:1.35}
.it-m{font-size:11.3px;color:var(--ink3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.it.done .it-t{text-decoration:line-through;color:var(--ink3)}
.it.skip{opacity:.5}
.it.cls{background:var(--blue-soft);border-color:transparent;cursor:default}
.it.emg{background:var(--red-soft);border-color:transparent}
.it.rout{background:var(--surface2)}
.it-act{display:flex;gap:4px;flex-shrink:0}
.mini-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink3);background:var(--surface)}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.on{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn svg{width:15px;height:15px}
.lockbadge{font-size:10.5px}
.prog{height:4px;border-radius:4px;background:var(--line2);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
/* ---------- month grid ---------- */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mh{font-size:10px;text-align:center;color:var(--ink3);font-weight:700;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.mc{min-height:62px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:4px 4px 3px;font-size:10px;overflow:hidden;text-align:left}
.mc.out{opacity:.35}
.mc.today{border-color:var(--accent);background:var(--accent-soft)}
.mc .dn{font-family:var(--f-num);font-weight:700;font-size:11px;color:var(--ink2);display:block;margin-bottom:2px}
.mc .dot{display:block;height:4px;border-radius:3px;margin-bottom:2px}
.mc .mtag{display:block;font-size:9.5px;line-height:1.25;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc.drop-on{background:var(--accent-soft);border-color:var(--accent)}
/* ---------- goal card ---------- */
.goal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.goal + .goal{margin-top:10px}
.goal-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.goal-h .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.eta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.eta div{background:var(--surface2);border-radius:10px;padding:9px 10px}
.eta b{display:block;font-family:var(--f-num);font-size:14px;font-weight:700;letter-spacing:-.02em}
.eta span{font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.verdict{margin-top:9px;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:9px}
.verdict.ok{background:var(--green-soft);color:var(--green)}
.verdict.bad{background:var(--red-soft);color:var(--red)}
.verdict.warn{background:var(--amber-soft);color:var(--amber)}
/* ---------- fab ---------- */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:52px;height:52px;border-radius:17px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg{width:23px;height:23px}
@media(min-width:821px){.fab{bottom:24px}}
:root[data-theme="dark"] .fab,:root:not([data-theme="light"]) .fab{color:#0F1216}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fab{color:#fff}}
.banner{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--amber-soft);color:var(--ink);font-size:12.8px;font-weight:600;margin-bottom:12px;border:1px solid var(--amber)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}


/* ---------- daily to-do (v7) ---------- */
.qa{display:flex;gap:8px}
.qa input{flex:1;font-size:16px;padding:11px 12px;border-radius:12px;background:var(--surface)}
.qa .btn{font-size:20px;padding:6px 16px;border-radius:12px}
.en-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.en-row .pill{min-width:38px;text-align:center}
.fixline{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12.8px;color:var(--ink2);line-height:1.4;margin-top:10px}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:block;width:100%}
.wk span{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wk b{display:block;font-weight:700;line-height:1.35}
.phase{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:14px 0 2px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:95;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:inherit;text-decoration:underline;margin-left:8px;font-weight:800}
@media(min-width:821px){#toast{bottom:28px}}
button:disabled{opacity:.6;cursor:progress}
</style>
</head>

<script>
/* ==================================================================
   SƠN STUDY OS v6 — engine
   ================================================================== */
const WEEK1_MON="2026-08-31", N_SESS=12, LS_KEY="son-study-os-v6";
const TR={
 IF   :{code:"ECON3014", name:"International Finance", short:"IF",     color:"#2C5A86", ico:"🌐"},
 BF   :{code:"FINC3022", name:"Banking & Finance",    short:"Banking", color:"#9A5B2A", ico:"🏦"},
 DA   :{code:"MindX",    name:"Data Analytics kỳ 2",  short:"DA",      color:"#6B4E9B", ico:"📊"},
 IELTS:{code:"IELTS",    name:"IELTS 7.0",            short:"IELTS",   color:"#1D7A6B", ico:"📝"},
 ZH   :{code:"中文",      name:"Tiếng Trung",          short:"Trung",   color:"#B03A48", ico:"汉"},
 MACRO:{code:"Macro",    name:"Macro & Equity Thinking",short:"Macro", color:"#8A6A1F", ico:"🧭"},
 BASE :{code:"Nền",      name:"Nền & sức khoẻ",       short:"Nền",     color:"#5C7A52", ico:"🌱"},
 SOC  :{code:"Bạn bè",   name:"Bạn bè & kết nối",     short:"Bạn bè",  color:"#B0577F", ico:"🤝"},
 LIFE :{code:"Khác",     name:"Khác",                 short:"Khác",    color:"#7E888F", ico:"•"}
};
const TKEYS=Object.keys(TR);
const IF_W=[null,["Multinational Financial Mgmt; International Monetary System","Ch.1, Ch.2"],["Balance of Payments","Ch.3"],["Foreign Exchange Market","Ch.5"],
 ["International Parity Conditions","Ch.6"],["Foreign Currency Derivatives","Ch.7"],["FX Rate Determination & Forecasting","Ch.9"],["Transaction Exposure","Ch.10"],
 ["Global Cost of Capital","Ch.13"],["Sourcing Capital Globally","Ch.14"],["International Trade Finance","Ch.16"],["Foreign Direct Investment","Ch.17"],["Summary of Subject","ôn tổng"]];
const BF_W=[null,["Why are FIs special?","Ch.1"],["FI Risks","Ch.7"],["Interest Rate Risk — Repricing","Ch.8"],["Interest Rate Risk — Duration","Ch.9"],
 ["Interest Rate Risk Management","Ch.23–27"],["Market Risk","Ch.15"],["Credit Risk — Individual Loan","Ch.10"],["Credit Risk — Loan Portfolio","Ch.11"],
 ["Liquidity Risk","Ch.12"],["Liability & Liquidity Management","Ch.19"],["Capital Management","Ch.21"],["Revision","ôn tổng"]];
/* which session a study block is about: "pre" = this week's class, "rev" = the latest class already held */
function blockSession(b,date){
  if(!(b.track==="IF"||b.track==="BF")||!b.hint||!date) return 0;
  const n=sessOfWeek(mondayOf(date)); if(!n) return 0;
  const classDay=b.track==="IF"?6:5, k=b.hint==="pre"?n:(dow(date)>=classDay?n:n-1);
  return k>=1&&k<=N_SESS?k:0;
}
function blockTopic(b,date){
  const k=blockSession(b,date), W=b.track==="IF"?IF_W:BF_W;
  return k&&W[k]?`S${k} · ${W[k][0]} (${W[k][1]})`:"";
}
/* study notes published next to the app (GitHub Pages renders study/*.md) */
const STUDY="study/";
const IF_NOTE=[null,["ch01","ch02"],["ch03"],["ch05"],["ch06"],["ch07"],["ch09"],["ch10"],["ch13"],["ch14"],["ch16"],["ch17"],[]];
const BF_NOTE=[null,["ch01"],["ch07"],["ch08"],["ch09"],[],[],[],[],[],[],[],[]];   // BFN notes follow the problem sets (up to Session 4 so far)
const STUDY_HOW={pre:"Đọc trước bài: ① xem Video Overview trong NotebookLM 10–15' ② đọc phần 1–2 của bài tóm tắt ③ ghi 3 câu hỏi mang lên lớp.",
  rev:"Ôn sau lớp (trong 48h): ① tải slide GV / problems từ Ultra, nạp vào NotebookLM ② hỏi 'slide GV khác gì bài tóm tắt?' ③ làm phần Tự kiểm tra KHÔNG nhìn đáp án ④ chữa, ghi lỗi sai. BFN: tự làm problems, không dùng AI."};
function studyLinks(b,date){
  const k=blockSession(b,date); if(!k) return "";
  const L=(b.track==="IF"?IF_NOTE:BF_NOTE)[k]||[], dir=b.track==="IF"?"if/":"bfn/";
  const btns=L.map(c=>`<a class="btn sm" href="${STUDY}${dir}${c}.html" target="_blank" rel="noopener">📖 Ch.${parseInt(c.slice(2),10)}</a>`).join("");
  return `<div class="mblk"><span class="mlab">Tuần này: ${h(blockTopic(b,date))}</span>
    <div class="row wrap" style="gap:6px;margin:4px 0 8px">${btns||'<span class="small muted">Chưa có bài tóm tắt cho tuần này — mở mục lục</span>'}<a class="btn sm ghost" href="${STUDY}${dir}" target="_blank" rel="noopener">Mục lục</a></div>
    <div class="small" style="color:var(--ink2)">${h(STUDY_HOW[b.hint]||"")}</div>
    <button class="btn sm" style="margin-top:8px" onclick="openPromptBuilder({subj:'${b.track}',topic:'${h(blockTopic(b,date))}',purpose:'${b.hint==="pre"?"summary":"quiz"}'})">✨ Tạo prompt cho buổi này</button></div>`;
}
const DA_HOW="Cách học với AI (3 bước, ~2h): ① Gemini ~15' — tải record buổi học lên, xin tóm tắt theo mốc thời gian + danh sách đoạn code/ví dụ thầy làm. ② Claude hoặc ChatGPT ~30' — hỏi lại chỗ chưa hiểu, nhờ giải thích từng dòng code; cần chạy thử dữ liệu / vẽ biểu đồ thì dùng ChatGPT (có chạy Python). ③ Tự làm lại bài thực hành từ đầu, không nhìn note ~75'. Không để AI làm hộ bước ③ — Final Project ~20h cần kỹ năng thật.";

/* ---------- date helpers ---------- */
function D(s){const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addD(s,n){const d=D(s);d.setDate(d.getDate()+n);return iso(d)}
function todayISO(){return iso(new Date())}
function dow(s){const d=D(s).getDay();return d===0?7:d}
function mondayOf(s){return addD(s,-(dow(s)-1))}
function dbet(a,b){return Math.round((D(b)-D(a))/86400000)}
function fmtD(s){if(!s)return "—";const d=D(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function fmtFull(s){if(!s)return "chưa có ngày";const d=D(s);return ["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+", "+fmtD(s)+"/"+d.getFullYear()}
function sessOfWeek(m){const n=Math.round(dbet(WEEK1_MON,m)/7)+1;return(n>=1&&n<=N_SESS)?n:null}
function sessDates(n){const m=addD(WEEK1_MON,(n-1)*7);return{mon:m,fri:addD(m,4),sat:addD(m,5),sun:addD(m,6)}}
function mm(t){const[a,b]=String(t).split(":").map(Number);return a*60+(b||0)}
function hhmm(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function hrs(n){return (Math.round(n*10)/10).toString().replace(".0","")}
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function aDone(a){return !!a.done||a.mark!=null}
function uid(){return Math.random().toString(36).slice(2,9)}
/* open/closed state of accordions survives re-render */
const accState={};

document.addEventListener("toggle",e=>{const k=e.target&&e.target.dataset&&e.target.dataset.acc;if(k)accState[k]=e.target.open},true);

const MACRO_WEEKS=[{"n":1,"d":"2026-09-14","m":"M1","p":"A","f":"Ba câu hỏi thay thế · Price = Earnings × Multiple","o":"Macro Journal chạy + 5 chuỗi nhân quả","g":"","s":[{"t":"Dựng Macro Journal + lịch dữ liệu tuần","l":"Tạo bảng 7 cột: ngày · headline · cửa (a/b/c) · chuỗi nhân quả · hàm ý tài sản · đoán price-in · kiểm chứng sau. Mở lịch kinh tế, đánh dấu 3 số quan trọng nhất tuần.","q":"Tuần này có số liệu vĩ mô Mỹ và VN nào, xếp theo mức thị trường quan tâm?|Consensus cho từng số đang là bao nhiêu?","o":"File Macro Journal tồn tại + 3 số đã đánh dấu"},{"t":"Ba câu hỏi thay thế","l":"Bỏ câu 'tin này tốt hay xấu'. Thay bằng: (1) cơ chế là gì — viết từng mắt xích; (2) ai được ai mất; (3) thị trường đã trả trước bao nhiêu.","q":"Cho tôi 5 headline vĩ mô hôm nay, hỏi ngược tôi 3 câu này từng cái và chấm câu trả lời|Câu nào của tôi là narrative chứ không phải cơ chế?","o":"5 headline trả lời đủ 3 câu"},{"t":"Ba cửa — Price ≈ Earnings × Multiple","l":"Multiple ≈ f(discount rate, risk premium, liquidity, growth). Mọi biến vĩ mô phải chạm (a) earnings, (b) discount rate, hoặc (c) risk premium/liquidity. Không chỉ được cửa nào là chưa hiểu tin đó.","q":"Tôi xếp headline này vào cửa (b), phản biện giúp tôi|Tin nào chạm nhiều hơn một cửa, cửa nào mạnh hơn?","o":"1 dòng journal + 5 headline đã phân cửa"},{"t":"Viết chuỗi nhân quả","l":"Chuỗi ≥4 mắt xích, mỗi mắt xích là một cơ chế có thể sai, bắt buộc có cả nhánh thắng lẫn nhánh thua. Học ví dụ chuỗi dầu 9 mắt xích trong tài liệu.","q":"Đây là chuỗi tôi viết — mắt xích nào đang nhảy cóc?|Mắt xích nào dễ đứt nhất, đứt thì hệ quả đảo chiều ra sao?","o":"2 chuỗi ≥4 mắt xích có nhánh ngược"},{"t":"Journal + ép viết nhánh ngược","l":"Cùng một cú sốc luôn có bên thắng và bên thua. Đọc một chiều ('dầu tăng là xấu') chính là lỗi bị chặn bởi câu hỏi số 2.","q":"Với cú sốc này, ai là bên thắng mà ít người nghĩ tới?|Bên thua chịu qua kênh doanh thu, chi phí hay tài chính?","o":"1 dòng journal đủ 2 nhánh"},{"t":"Bốn lớp bằng chứng","l n + term premium.","q":"Giải thích 5 nguồn làm 10Y thay đổi và cách phân biệt bằng dữ liệu|Chuỗi FRED nào đọc được từng thành phần?","o":"Sơ đồ decompose 10Y"},{"t":"Phân biệt bằng dữ liệu","l":"Breakeven tăng + real yield đứng = chuyện lạm phát. Real yield tăng + breakeven đứng = chuyện tăng trưởng hoặc term premium. 2Y dẫn = chuyện chính sách.","q":"Cho 3 tình huống lợi suất tăng, tôi phân loại rồi bạn kiểm tra lại|Trường hợp nào nén multiple mạnh nhất?","o":"Bảng 3 tình huống → nguồn gốc"},{"t":"Journal — đọc lợi suất mỗi ngày","l":"Mỗi dòng ghi: 10Y đổi bao nhiêu bps, do breakeven hay real yield, hàm ý cho multiple.","q":"Hôm nay 10Y đổi do thành phần nào, bằng chứng ở chuỗi nào?","o":"1 dòng journal có phân rã 10Y"},{"t":"Dựng dashboard FRED 6 chuỗi","l":"DGS2, DGS10, T10YIE, DFII10, T10Y2Y, BAMLH0A0HYM2 — một chart hai trục. Cập nhật hằng tuần đến hết khoá.","q":"Cách lấy 6 chuỗi FRED này tự động và vẽ 2 trục|Chuẩn hoá thế nào để nhìn chung một chart?","o":"Dashboard FRED 6 chuỗi chạy được"},{"t":"Journal + đọc dashboard","l":"Dùng chính dashboard vừa dựng để viết dòng journal hôm nay.","q":"Từ 6 chuỗi này, thị trường trái phiếu đang định giá kịch bản gì?","o":"1 dòng journal đọc từ dashboard"},{"t":"Chốt tuần 6","l":"Ghi trạng thái hiện tại của 6 chuỗi và câu chuyện chúng đang kể.","q":"Phản biện cách đọc 6 chuỗi của tôi","o":"Note trạng thái 6 chuỗi"}]},{"n":7,"d":"2026-10-26","m":"M4","p":"B","f":"Yield curve 4 chế độ · credit spread · TT1 vs TT2","o":"Note 1 trang: US10Y 12 tháng qua","g":"M4: cho một tuần US10Y tăng 20bps, chỉ ra nguồn gốc bằng bằng chứng breakeven / real yield / 2Y","s":[{"t":"Reset tuần","l":"Cập nhật dashboard FRED, ghi thay đổi tuần.","q":"Tuần này số nào có thể làm đổi đường cong lợi suất?","o":"Dashboard cập nhật + 1 dòng journal"},{"t":"Yield curve — 4 chế độ","l":"Bull steepening, bear steepening, bull flattening, bear flattening. Mỗi chế độ là một câu chuyện khác về chính sách và tăng trưởng.","q":"Giải thích 4 chế độ kèm ví dụ lịch sử và hàm ý cổ phiếu|Đường cong hiện tại đang ở chế độ nào?","o":"Bảng 4 chế độ + chế độ hiện tại"},{"t":"Credit spread — giá của rủi ro","l":"HY OAS nhạy hơn VIX. Spread nới trước khi cổ phiếu giảm là tín hiệu đáng tin nhất về khẩu vị rủi ro.","q":"Vì sao credit spread dẫn cổ phiếu?|Nới bao nhiêu bps thì đáng báo động?","o":"Ghi ngưỡng HY OAS theo dõi"},{"t":"Journal + spread","l":"Một dòng, ưu tiên tin liên quan lợi suất hoặc spread.","q":"Spread tuần này nói gì về khẩu vị rủi ro?","o":"1 dòng journal"},{"t":"TT1 vs TT2 — lỗi phổ biến nhất","l":"TT1 (dân cư–doanh nghiệp) và TT2 (liên ngân hàng) là hai thị trường khác nhau. TT2 căng không tự động kéo TT1 lên.","q":"Chart lãi suất O/N vs huy động 12 tháng 3 năm — TT2 căng thì TT1 phản ứng sau bao lâu?|Khi nào TT2 mới truyền sang TT1?","o":"Chart TT1 vs TT2 + độ trễ"},{"t":"Viết note 1 trang","l":"'US10Y đã đi đâu trong 12 tháng qua và vì sao' — bắt buộc decompose theo 5 nguồn, có bằng chứng breakeven và real yield cho từng đoạn.","q":"Chấm note này: chỗ nào tôi kết luận mà không có bằng chứng phân rã?","o":"Note 1 trang hoàn chỉnh"},{"t":"🚧 Cổng M4","l":"Cho một tuần 10Y tăng 20bps bất kỳ, chỉ ra nguồn gốc bằng bằng chứng.","q":"Cho tôi một tuần lịch sử 10Y tăng mạnh, tôi phân rã rồi bạn chấm","o":"Qua/không qua cổng M4"}]},{"n":8,"d":"2026-11-02","m":"M5","p":"B","f":"USD/VND · carry trade · cơ chế tín phiếu SBV","o":"Chuỗi 8 mắt xích tín phiếu","g":"M5: giải thích trọn một đợt SBV phát hành tín phiếu, từ chênh lệch lãi suất VND–USD đến giá cổ phiếu nhóm chứng khoán","s":[{"t":"Reset tuần (tuần Report 40% — chỉ đọc)","l":"Hạn Report FINC3022 ngày 08/11. Tuần này khoá macro giảm tải theo thiết kế: đọc và journal, không bài tập nặng.","q":"Tuần này có tin gì đủ lớn để đổi Fed path hoặc tỷ giá không?","o":"1 dòng journal"},{"t":"USD là hệ thống funding, không phải một đồng tiền","l":"Phần lớn nợ ngoài nước Mỹ vay bằng USD. USD mạnh = điều kiện tài chính toàn cầu thắt lại, kể cả khi Fed không làm gì.","q":"Cơ chế U /* ============================ STATE / SYNC ============================ */
let state=seed(), cloud=null, saveT=null, tab="today", weekOff=0, calMode="week", monthCur=null, patched=false;

function lsLoad(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function setSync(c,t){const p=document.getElementById("syncPill");if(!p)return;p.className="sync "+c;document.getElementById("syncTxt").textContent=t}

/* merge saved progress onto a fresh seed → new content arrives, progress survives */
function upgrade(old){
  const s=seed();
  if(!old) return s;
  if(old.v===6){
    // same shape: carry everything the user owns
    ["assess","tasks","habits","goals","confirm","plans","people"].forEach(k=>{ if(Array.isArray(old[k])) s[k]=old[k]; });
    ["energy","review","top"].forEach(k=>{ if(old[k]&&typeof old[k]==="object") s[k]=old[k]; });
    if(old.dlog) s.dlog=old.dlog; if(old.placed) s.placed=old.placed; if(old.macro) s.macro=Object.assign(s.macro,old.macro);
    if(old.routine&&old.routine.tplV>=4) s.routine=old.routine;
    if(old.ielts) s.ielts=Object.assign(s.ielts,old.ielts);
    if(old.zh&&old.zh.phases) s.zh.phases=old.zh.phases;
    if(old.da&&old.da.sessions) s.da=old.da;
    if(old.settings) s.settings=Object.assign(s.settings,old.settings);
    s.rev=old.rev||1; s.patches=old.patches||s.patches;
    if(!s.patches.includes("v7-load40")){   // Oct 2026: ~40h/week, no gym (gout), friends T2/T6/CN, DA homework 4h
      s.habits=s.habits.filter(x=>x.id!=="hg");
      const c2=s.confirm.find(c=>c.id==="c2"); if(c2)c2.done=true;
      s.da.note=seed().da.note; s.placed=false;
      if(s.settings.dayStart==="06:00") s.settings.dayStart="07:30";   // the old gym hour is now sleep
      s.patches=s.patches.concat("v7-load40"); patched=true;
    }
    if(!s.patches.includes("v7b-exams")){   // real exam dates, BFN presentation topic, Chinese paused
      const fresh=seed();
      fresh.assess.forEach(n=>{const o=s.assess.find(a=>a.id===n.id); if(!o){s.assess.push(n);return}
        ["title","due","dueTime","prov","session","where","note"].forEach(k=>o[k]=n[k]);});
      s.tasks=s.tasks.filter(x=>!(/^t\d+b$/.test(x.id)&&x.status!=="done"));
      fresh.tasks.forEach(n=>{const o=s.tasks.find(x=>x.id===n.id);
        if(!o) s.tasks.push(n); else if(o.status!=="done") ["t","date","start","dur","link","pri","track"].forEach(k=>o[k]=n[k]);});
      const hz=s.habits.find(x=>x.id==="hz"); if(hz){hz.paused=true;hz.rule=fresh.habits[0].rule}
      const gz=s.goals.find(x=>x.id==="g-zh"); if(gz){gz.paused=true;gz.targetDate="";gz.note=fresh.goals.find(x=>x.id==="g-zh").note}
      const gs=s.goals.find(x=>x.id==="g-school"); if(gs)gs.targetDate="2026-12-02";
      ["c3","c5","c6"].forEach(id=>{const o=s.confirm.find(c=>c.id===id),n=fresh.confirm.find(c=>c.id===id); if(o&&n){o.t=n.t;o.done=n.done}});
      const ip=s.assess.find(a=>a.id==="if-pres"); if(ip&&ip.mark==null)ip.done=true;   // presented 12/09
      s.placed=false; s.patches=s.patches.concat("v7b-exams"); patched=true;
    }
    if(!s.patches.includes("v7c-ielts")){   // IELTS 7.0 target: mid-Jan 2027
      const gi=s.goals.find(x=>x.id==="g-ielts"), ng=seed().goals.find(x=>x.id==="g-ielts");
      if(gi){gi.targetDate=ng.targetDate;gi.note=ng.note} else s.goals.unshift(ng);
      s.patches=s.patches.concat("v7c-ielts"); patched=true;
    }
    return s;
  }
  // v5 → v6: carry progress by id
  patched=true;
  const byId=(arr,id)=>(arr||[]).find(x=>x.id===id);
  s.assess.forEach(a=>{const o=byId(old.assess,a.id); if(o){a.mark=o.mark??a.mark; if(o.mark!=null)a.markedAt=o.markedAt;}});
  (old.tasks||[]).forEach(o=>{ if(o.done){ const t=s.tasks.find(x=>x.link===o.link&&x.t===o.t); if(t)t.status="done"; }});
  s.confirm.forEach(c=>{const o=byId(old.ultra,c.id.replace("c","u")); if(o&&o.done)c.done=true;});
  if(old.ielts){
    s.ielts.aim=old.ielts.aim||7; s.ielts.examDate=old.ielts.examDate||""; s.ielts.mocks=old.ielts.mocks||[];
    s.ielts.phases.forEach(p=>{const op=byId(old.ielts.phases,p.id); if(op)p.units.forEach(u=>{const ou=byId(op.units,u.id); if(ou&&ou.done){u.done=true;u.at=ou.at}});});
  }
  return s;
}
function save(){
  state.rev=(state.rev||1)+1; lsSave(); render();
  if(!cloud) return;
  setSync("saving","đang lưu"); clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{ await cloud.doc("state/main").set({rev:state.rev,at:new Date().toISOString(),json:JSON.stringify(state)}); setSync("ok","đã đồng bộ"); }
    catch(e){ setSync("local","lưu máy này"); }
  },700);
}
async function initCloud(){
  const local=lsLoad(); if(local) state=upgrade(local);
  if(normalizeOnce()) patched=true;
  render(); if(patched) lsSave();
  let c=null; try{ if(typeof claude!=="undefined"&&claude&&claude.use) c=await claude.use("db"); }catch(e){c=null}
  if(!c){ setSync("local","lưu máy này"); return; }
  cloud=c;
  try{
    const snap=await cloud.doc("state/main").get(); const d=snap.exists?snap.data():null;

/* ========================= SCHEDULER ENGINE ========================= */
function dayStart(){return mm(state.settings.dayStart||"07:30")}
function dayEnd(){return mm(state.settings.dayEnd||"23:00")}
function routineOn(date){ return (state.routine.tpl[dow(date)]||[]).map(b=>({...b,kind:"rout",start:mm(b.from),end:mm(b.to)})); }
function fixedOn(date){ const r=routineOn(date); const m=macroFor(date); if(m) r.push(m); return r; }
function tasksOn(date){ return state.tasks.filter(t=>t.date===date); }
function taskEnd(t){ return (t.start||0)+(t.dur||60); }
function isActive(t){ return t.status!=="skipped"; }
/* --- per-day completion (routine blocks get ticked per date) --- */
function isDone(x,date){ return x.kind==="task" ? x.status==="done" : !!((state.dlog||{})[date]||{})[x.id]; }
function tgDay(id,date){ state.dlog=state.dlog||{}; const d=state.dlog[date]=state.dlog[date]||{}; if(d[id]) delete d[id]; else d[id]=1; save(); }
/* --- macro curriculum --- */
function macroFor(date){
  const M=state.macro; if(!M||!M.on) return null;
  const i=dbet(M.start,date); if(i<0) return null;
  const w=Math.floor(i/7), d=i%7; if(w>=MACRO_WEEKS.length) return null;
  const wk=MACRO_WEEKS[w], se=wk.s[d];
  return {id:"mc-"+(w+1)+"-"+(d+1), kind:"macro", track:"MACRO", w:w+1, d:d+1, wk, se,
          t:"Macro "+(w+1)+"."+(d+1)+" · "+se.t, start:mm(M.time), dur:M.dur, end:mm(M.time)+M.dur};
}
function macroStats(){
  const log=state.dlog||{}; let done=0;
  Object.keys(log).forEach(dt=>Object.keys(log[dt]).forEach(k=>{ if(k.startsWith("mc-")&&log[dt][k]) done++; }));
  const n=MACRO_WEEKS.length*7;
  return {n, done, pct:Math.round(done/n*100), hAll:n*0.5, hDone:done*0.5};
}
function macroWeekDone(w){
  const log=state.dlog||{}; let d=0;
  Object.keys(log).forEach(dt=>Object.keys(log[dt]).forEach(k=>{ if(k.indexOf("mc-"+w+"-")===0&&log[dt][k]) d++; }));
  return d;
}
function dayProgress(date){ const it=dayItems(date).filter(x=>!x.rest); return {n:it.length, d:it.filter(x=>isDone(x,date)).length}; }
/* every occupied interval on a day */
function busy(date,ignoreId){
  const out=[];
  fixedOn(date).forEach(b=>out.push({start:b.start,end:b.end,type:b.fixed?"fixed":"rout",label:b.label||b.t}));
  tasksOn(date).forEach(t=>{ if(t.id!==ignoreId&&isActive(t)) out.push({start:t.start,end:taskEnd(t),type:t.emg?"emg":(t.locked?"lock":"task"),label:t.t,id:t.id}); });
  return out.sort((a,b)=>a.start-b.start);
}
function overlap(a1,a2,b1,b2){ return a1<b2&&b1<a2 }
function conflictsAt(date,start,end,ignoreId){ return busy(date,ignoreId).filter(b=>overlap(start,end,b.start,b.end)); }
function freeSlots(date,dur,ignoreId,after){
  const b=busy(date,ignoreId), out=[]; let cur=Math.max(dayStart(),after||0);
  b.forEach(x=>{ if(x.start-cur>=dur) out.push({start:cur,end:x.start}); cur=Math.max(cur,x.end); });
  if(dayEnd()-cur>=dur) out.push({start:cur,end:dayEnd()});
  return out;
}
function nextFreeSlot(fromDate,fromMin,dur,ignoreId,maxDays){
  let d=fromDate;
  for(let i=0;i<(maxDays||45);i++){
    const s=freeSlots(d,dur,ignoreId,i===0?fromMin:0)[0];
    if(s) return {date:d,start:s.start};
    d=addD(d,1);
  }
  return null;
}
/* auto-reflow: push every movable task out of a collision, keeping order */
function reflow(){
  const moved=[];
  const movable=state.tasks.filter(t=>!t.locked&&!t.emg&&isActive(t)&&t.status!=="done")
    .sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  movable.forEach(t=>{
    const hard=busy(t.date,t.id).filter(b=>b.type==="fixed"||b.type==="emg"||b.type==="lock"||b.type==="rout"||b.type==="task");
    const hit=hard.some(b=>overlap(t.start,taskEnd(t),b.start,b.end));
    if(!hit) return;
    const slot=nextFreeSlot(t.date,t.start,t.dur,t.id);
    if(slot&&(slot.date!==t.date||slot.start!==t.start)){ moved.push({t:t.t,from:t.date+" "+hhmm(t.start),to:slot.date+" "+hhmm(slot.start)}); t.date=slot.date; t.start=slot.start; }
  });
  return moved;
}
/* same day first, then up to 6 days earlier, then later — but never on/after the linked deadline */
function placeNear(z){
  const due=(z.link&&(state.assess.find(a=>a.id===z.link)||{}).due)||"9999", base=z.date, tries=[base];
  for(let k=1;k<=6;k++)tries.push(addD(base,-k));
  for(let k=1;k<=3;k++)tries.push(addD(base,k));
  for(const d of tries){ if(d>=due&&d!==base)continue; const a=freeSlots(d,z.dur,z.id,0)[0]; if(a){z.date=d;z.start=a.start;return true} }
  return false;
}
/* one-time: nudge any seeded task that lands on top of the weekly routine */
function normalizeOnce(){
  if(state.placed) return false;
  let moved=0;
  state.tasks.filter(t=>!t.locked&&!t.emg&&t.status!=="done").forEach(t=>{
    if(!conflictsAt(t.date,t.start,taskEnd(t),t.id).length) return;
    const same=freeSlots(t.date,t.dur,t.id,720)[0]||freeSlots(t.date,t.dur,t.id,0)[0];
    if(same){ t.start=same.start; moved++; return; }
    // a long block with no gap that fits: split it in two halves on the same day (or the next free ones)
    if(t.dur>=120){
      const half=Math.round(t.dur/2/15)*15, y=Object.assign({},t,{id:t.id+"b",t:t.t+" (phần 2/2)",dur:t.dur-half});
      t.t+=" (phần 1/2)"; t.dur=half; state.tasks.push(y);
      [t,y].forEach(z=>placeNear(z));
      moved++; return;
    }
    const s2=nextFreeSlot(addD(t.date,1),0,t.dur,t.id);
    if(s2){ t.date=s2.date; t.start=s2.start; moved++; }
  });
  state.placed=true;
  return moved>0;
}
function audit(){
  const out=[];
  state.tasks.filter(t=>isActive(t)&&t.status!=="done"&&!t.locked&&!t.emg).forEach(t=>{
    const c=conflictsAt(t.date,t.start,taskEnd(t),t.id);
    if(c.length) out.push({id:t.id,t:t.t,date:t.date,with:c[0].label});
  });
  return out;
}

/* ============================ GOAL MATH ============================ */
function ielUnits(){ return state.ielts.phases.flatMap(p=>p.units) }
function zhUnits(){ return state.zh.phases.flatMap(p=>p.units) }
function unitStats(list){
  const all=list.reduce((s,u)=>s+(u.hh||0),0), done=list.filter(u=>u.done).reduce((s,u)=>s+(u.hh||0),0);
  return {all,done,left:all-done,pct:all?Math.round(done/all*100):0,n:list.length,nd:list.filter(u=>u.done).length};
}
function paceOf(list){ // real h/week over last 21 days
  const cut=addD(todayISO(),-21);
  return list.filter(u=>u.done&&u.at&&u.at>=cut).reduce((s,u)=>s+(u.hh||0),0)/3;
}
function weeklyFor(track){
  let t=0; for(let i=1;i<=7;i++)(state.routine.tpl[i]||[]).forEach(b=>{ if(b.track===track&&!b.rest) t+=(mm(b.to)-mm(b.from))/60; });
  if(track==="MACRO"&&state.macro&&state.macro.on) t+=state.macro.dur/60*7;
  return t;
}
function goalStats(g){
  let st,pace,list=null;
  if(g.src==="ielts"){ list=ielUnits(); st=unitStats(list); }
  else if(g.src==="zh"){ list=zhUnits(); st=unitStats(list); }
  else if(g.src==="macro"){ const m=macroStats(); st={all:m.hAll,done:m.hDone,left:m.hAll-m.hDone,pct:m.pct,n:m.n,nd:m.done}; }
  else if(g.src==="da"){ const done=(state.da.sessions||[]).filter(s=>s.done).length,n=(state.da.sessions||[]).length;
    st={all:n*3,done:done*3,left:(n-done)*3,pct:n?Math.round(done/n*100):0,n,nd:done}; }
  else if(g.src==="school"){ const A=state.assess.filter(a=>a.weight>0), tot=A.reduce((s,a)=>s+a.weight,0),
    dn=A.filter(a=>a.mark!=null).reduce((s,a)=>s+a.weight,0);
    st={all:tot,done:dn,left:tot-dn,pct:tot?Math.round(dn/tot*100):0,n:A.length,nd:A.filter(a=>a.mark!=null).length}; }
  else { st={all:+g.totalH||0,done:+g.doneH||0,left:Math.max(0,(+g.totalH||0)-(+g.doneH||0)),
    pct:g.totalH?Math.round((g.doneH||0)/g.totalH*100):0,n:0,nd:0}; }
  pace=list?paceOf(list):0;
  if(g.src==="school"){
    const nx=state.assess.filter(a=>!aDone(a)&&a.weight>0&&a.due).sort((x,y)=>x.due.localeCompare(y.due))[0];
    return {st,planned:weeklyFor(g.track),pace:0,etaPlan:null,etaPace:null,need:null,byPoints:true,
      verdict:nx?{c:dbet(todayISO(),nx.due)<=10?"warn":"ok",t:`Còn ${st.n-st.nd} đầu điểm · gần nhất: ${nx.title} (${nx.weight}%) ngày ${fmtD(nx.due)}`}:null};
  }
  const planned=weeklyFor(g.track);
  const wkPlan=planned>0?st.left/planned:null;
  const wkPace=pace>0?st.left/pace:null;
  const etaPlan=wkPlan!=null?addD(todayISO(),Math.ceil(wkPlan*7)):null;
  const etaPace=wkPace!=null?addD(todayISO(),Math.ceil(wkPace*7)):null;
  let need=null,verdict=null;
  if(g.targetDate){
    const wk=Math.max(0.15,dbet(todayISO(),g.targetDate)/7);
    need=st.left/wk;
    if(dbet(todayISO(),g.targetDate)<0) verdict={c:"bad",t:"Đã quá ngày mục tiêu"};
    else if(need<=planned) verdict={c:"ok",t:`Kịp — cần ${hrs(need)}h/tuần, khung tuần đang cấp ${hrs(planned)}h`};
    else verdict={c:planned>0&&need<planned*1.5?"warn":"bad",t:`Thiếu — cần ${hrs(need)}h/tuần nhưng chỉ có ${hrs(planned)}h. Hụt ${hrs(need-planned)}h/tuần`};
  }
  return {st,planned,pace,etaPlan,etaPace,need,verdict};
}
function bandRound(x){return Math.round(x*2)/2}
function mockOverall(m){const v=[m.r,m.l,m.w,m.s].map(Number).filter(x=>!isNaN(x)&&x>0);return v.length?bandRound(v.reduce((a,b)=>a+b,0)/v.length):null}
function weekLoad(){
  const o={}; TKEYS.forEach(k=>o[k]=0);
  let rest=0;
  for(let i=1;i<=7;i++)(state.routine.tpl[i]||[]).forEach(b=>{const hh=(mm(b.to)-mm(b.from))/60; if(b.rest){rest+=hh;return} o[b.track]=(o[b.track]||0)+hh});
  o.rest=rest;
  o.fixed=0; for(let i=1;i<=7;i++)(state.routine.tpl[i]||[]).forEach(b=>{if(b.fixed)o.fixed+=(mm(b.to)-mm(b.from))/60});
  if(state.macro&&state.macro.on) o.MACRO=(o.MACRO||0)+state.macro.dur/60*7;
  o.total=TKEYS.reduce((a,k)=>a+o[k],0); o.self=o.total-o.fixed;
  return o;
}
function habitStreak(hb){
  let n=0,d=todayISO();
  if(!hb.log[d]) d=addD(d,-1);
  while(hb.log[d]){n++;d=addD(d,-1)}
  return n;
}

function pullOverdue(){const t=todayISO();

function moveMonth(n){const c=monthCur||todayISO().slice(0,7)+"-01";const d=D(c);d.setMonth(d.getMonth()+n,1);monthCur=iso(d)}
function weekHTML(){

    const dl=state.assess.filter(a=>a.due===d);

function monthHTML(){
  const t=todayISO(), c=monthCur||t.slice(0,7)+"-01", first=D(c);
  const start=mondayOf(iso(first)); const cells=[];
  for(let i=0;i<42;i++){

/* drag & drop */
let dragId=null;
function dragStart(e,id){dragId=id;e.dataTransfer.setData("text/plain",id);e.dataTransfer.effectAllowed="move";e.target.classList.add("dragging")}
function dragEnd(e){e.target.classList.remove("dragging");document.querySelectorAll(".drop-on").forEach(x=>x.classList.remove("drop-on"))}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect="move"}
function dropDay(e,date){
  e.preventDefault();
  const id=dragId||e.dataTransfer.getData("text/plain"); dragId=null;
  const x=state.tasks.find(t=>t.id===id); if(!x)return;
  const s=freeSlots(date,x.dur,x.id,x.start)[0]||freeSlots(date,x.dur,x.id,0)[0];
  x.date=date; if(s)x.start=s.start;
  save();
}

function saveTask(id){

}

function saveBlock(day,id){
  const nd=+v("bD")||day;
  const from=v("bF")||"08:00", to=v("bT")||"09:00";
  if(mm(to)<=mm(from)){alert("Giờ kết thúc phải sau giờ bắt đầu.");return}
  const old=(state.routine.tpl[day]||[]).find(x=>x.id===id)||{};
  state.routine.tpl[day]=(state.routine.tpl[day]||[]).filter(x=>x.id!==id);
  state.routine.tpl[nd]=state.routine.tpl[nd]||[];
  state.routine.tpl[nd].push(Object.assign({},old,{id:id||("b"+uid()),label:v("bL")||"Block",from,to,track:v("bK"),fixed:ck("bX")}));
  closeSheet(); save();
}

function isOpen(x){return x.status!=="done"&&x.status!=="skipped"}

function autoTop(date){
  const A=state.assess;
  return tasksOn(date).filter(x=>x.status!=="skipped").map(x=>{
    let s=(x.pri||3)*10+(x.emg?50:0)+(x.plan?4:0);
    const a=x.link&&A.find(y=>y.id===x.link); if(a&&a.due){const dd=dbet(date,a.due); if(dd>=0&&dd<=14)s+=(14-dd)*2;}
    return {x,s};
  }).sort((a,b)=>b.s-a.s||a.x.start-b.x.start).slice(0,3).map(o=>o.x);
}
function topTasks(date){

/* ---------- week numbers for the 5 fixes ---------- */
function weekStats(mon){
  const t=todayISO(), days=[]; for(let i=0;i<7;i++){const d=addD(mon,i); if(d<=t)days.push(d)}
  let topWin=0,topDays=0,done=0,all=0,planMin=0,planDays=0,en=0,enN=0,rev=0;
  days.forEach(d=>{
    const tp=topTasks(d); if(tp.length){topDays++; if(tp.every(x=>x.status==="done"))topWin++;}
    const ts=tasksOn(d).filter(x=>x.status!=="skipped"); all+=ts.length; done+=ts.filter(x=>x.status==="done").length;
    const pd=ts.filter(x=>x.plan&&x.status==="done"); if(pd.length)planDays++; planMin+=pd.reduce((s,x)=>s+(x.dur||0),0);
    const e=(state.energy||{})[d]; if(e){en+=e;enN++}
    if((state.review||{})[d]&&(state.review||{})[d].at)rev++;
  });
  const contacts=(state.people||[]).reduce((s,p)=>s+(p.log||[]).filter(d=>d>=mon&&d<=addD(mon,6)).length,0);
  const half=state.tasks.filter(x=>isOpen(x)&&x.date<=t&&(x.progress||0)>0).length;
  return {days:days.length,topWin,topDays,done,all,planMin,planDays,en:enN?en/enN:null,rev,contacts,half};
}
function fixMetric(n,w){
  if(n===2) return `${w.planDays}/${w.days} ngày giữ nhịp mục tiêu dài hạn · tích luỹ ${hrs(w.planMin/60)}h`;
  if(n===3) return `Thắng Top 3: ${w.topWin}/${w.topDays} ngày`;
  if(n===5) return `Xong ${w.done}/${w.all} việc · ${w.half} việc đang dở · chốt ngày ${w.rev}/${w.days}`;
  if(n===6) return `${w.contacts} lần liên hệ có chủ đích`;
  if(n===8) return w.en?`Năng lượng TB ${w.en.toFixed(1)}/5`:"Chưa chấm năng lượng ngày nào";
  return "";
}

/* ---------- quick add: "Gửi mail thầy mai 9h 30p #if !" ---------- */
const QTAG={if:"IF",bf:"BF",bank:"BF",banking:"BF",da:"DA",ielts:"IELTS",trung:"ZH",zh:"ZH",tq:"ZH",macro:"MACRO",nen:"BASE",banbe:"SOC",ban:"SOC",khac:"LIFE",job:"LIFE",viec:"LIFE"};
function parseQuick(raw){
  let s=" "+String(raw).replace(/\s+/g," ")+" ", date=null, start=null, dur=null, track=null, pri=3;
  const t=todayISO(), B="(^|\\s)", E="(?=\\s|$)";
  const take=(re,fn)=>{const m=s.match(re); if(m){fn(m); s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length)}};
  take(/(^|\s)!+(?=\s|$)/,()=>pri=5);
  take(/(^|\s)#([a-zA-Z]+)(?=\s|$)/,m=>track=QTAG[m[2].toLowerCase()]||"LIFE");
  take(new RegExp(B+"(hôm nay|hnay)"+E,"i"),()=>date=t);
  take(new RegExp(B+"(ngày kia|mốt)"+E),()=>date=addD(t,2));
  take(new RegExp(B+"(ngày mai|mai)"+E),()=>date=addD(t,1));
  take(new RegExp(B+"(thứ\\s?([2-7])|t([2-7])|cn|chủ nhật)"+E,"i"),m=>{
    const w=m[3]||m[4]?+(m[3]||m[4])-1:7; let d=t; for(let i=0;i<7;i++){if(dow(d)===w)break; d=addD(d,1)} date=d});
  take(/(^|\s)(\d{1,2})\/(\d{1,2})(?=\s|$)/,m=>{let y=+t.slice(0,4); let d=iso(new Date(y,+m[3]-1,+m[2]));
    if(dbet(t,d)<-30)d=iso(new Date(y+1,+m[3]-1,+m[2])); date=d});
  take(new RegExp(B+"(\\d{1,2})(?:h|:)(\\d{2})?(\\s*(sáng|trưa|chiều|tối))?"+E,"i"),m=>{
    let hh=+m[2]; const mi=+(m[3]||0), p=(m[5]||"").toLowerCase();
    if((p==="chiều"||p==="tối")&&hh<12)hh+=12; if(p==="trưa"&&hh<5)hh+=12;
    if(hh<24&&mi<60)start=hh*60+mi});
  take(new RegExp(B+"(\\d{1,3})\\s?(p|ph|phút)"+E,"i"),m=>dur=+m[2]);
  take(new RegExp(B+"(\\d+(?:[.,]\\d+)?)\\s?(tiếng|giờ)"+E,"i"),m=>dur=Math.round(parseFloat(m[2].replace(",","."))*60));
  const title=s.replace(/\s+/g," ").trim();
  return {t:title||"Việc mới",date:date||t,start,dur:Math.max(5,dur||30),track:track||"LIFE",pri};
}

const WD=["","T2","T3","T4","T5","T6","T7","CN"];
function planById(id){return (state.plans||[]).find(p=>p.id===id)}
function planStats(p){
  const S=p.steps||[], all=S.reduce((s,x)=>s+(+x.min||0),0);
  const pt=state.tasks.filter(t=>t.plan===p.id);
  const doneMin=pt.filter(t=>t.status==="done").reduce((s,t)=>s+(t.dur||0),0);
  const nd=S.filter(x=>x.done).length, t=todayISO();
  const open=pt.filter(isOpen).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  const missed=open.filter(x=>x.date<t).length;
  const next=open.find(x=>x.date>=t)||null;
  const unplaced=S.filter(s=>!s.done&&!pt.some(x=>x.step===s.id&&isOpen(x))).length;
  const eta=open.length?open[open.length-1].date:null;
  const week=Math.max(1,Math.floor(dbet(p.from||p.created||t,t)/7)+1);
  return {all,doneMin,nd,n:S.length,pct:S.length?Math.round(nd/S.length*100):0,missed,next,unplaced,eta,week};
}
/* free start closest to the preferred time; late-night endings (after 22:30) are penalised — sleep is part of the plan (#8) */
function bestStart(d,dur,pref,after){
  let best=null,score=1e9;
  freeSlots(d,dur,null,after).forEach(sl=>{
    const st=Math.min(Math.max(pref,sl.start),sl.end-dur), sc=Math.abs(st-pref)+(st+dur>22*60+30?180:0);
    if(sc<score){score=sc;best=st}
  });
  return best;
}
/* place every unfinished step on the calendar: one session per allowed day, weekly cap, preferred time first */
function schedulePlan(p,from){
  state.tasks=state.tasks.filter(t=>!(t.plan===p.id&&t.status!=="done"));
  const t=todayISO(), days=(p.days&&p.days.length)?p.days:[1,2,3,4,5,6,7];
  const sess=Math.max(15,+p.sess||45), cap=Math.max(sess,Math.round((+p.hpw||3)*60)), pref=mm(p.time||"20:00");
  const todo=(p.steps||[]).filter(s=>!s.done).map(s=>{
    const doneMin=state.tasks.filter(x=>x.plan===p.id&&x.step===s.id&&x.status==="done").reduce((a,x)=>a+(x.dur||0),0);
    return {s,left:Math.max(15,(+s.min||sess)-doneMin),parts:Math.max(1,Math.ceil(Math.max(15,(+s.min||sess)-doneMin)/sess)),k:0};
  });
  const used={}; let d=(from&&from>t)?from:t, i=0, guard=0, placed=0, last=null;
  while(i<todo.length&&guard<400){
    guard++;
    if(days.includes(dow(d))){
      const wk=mondayOf(d); used[wk]=used[wk]||0;
      const cur=todo[i], allot=Math.min(cur.left,sess,cap-used[wk]);
      if(allot>=15){
        const after=d===t?Math.ceil(nowMin()/15)*15:0;
        const st=bestStart(d,allot,pref,after);
        if(st!=null){
          cur.k++;
          state.tasks.push({id:"p"+uid(),t:cur.s.t+(cur.parts>1||cur.k>1?` · phần ${cur.k}`:""),track:p.track,date:d,start:st,dur:allot,
            pri:p.pri||4,status:"pending",progress:0,plan:p.id,step:cur.s.id,note:cur.s.how||"",out:cur.s.out||""});
          used[wk]+=allot; cur.left-=allot; placed++; last=d;
          if(cur.left<15) i++;
        }
      }
    }
    d=addD(d,1);
  }
  return {placed,last,unplaced:todo.length-i,late:!!(p.due&&last&&last>p.due)};
}
function syncStep(x){
  const p=x&&x.plan&&planById(x.plan); if(!p)return; const s=(p.steps||[]).find(y=>y.id===x.step); if(!s)return;
  const parts=state.tasks.filter(t=>t.plan===p.id&&t.step===s.id&&t.status!=="skipped");
  s.done=parts.length>0&&parts.every(t=>t.status==="done"); s.at=s.done?todayISO():null;
}
function tgStep(pid,sid){
  const p=planById(pid); if(!p)return; const s=(p.steps||[]).find(y=>y.id===sid); if(!s)return;
  s.done=!s.done; s.at=s.done?todayISO():null;
  state.tasks.filter(t=>t.plan===pid&&t.step===sid).forEach(t=>{t.status=s.done?"done":"pending";t.progress=s.done?100:0;t.doneAt=s.done?todayISO():null});
  save(); openPlanView(pid);
}
function replan(pid){const p=planById(pid);if(!p)return;const r=schedulePlan(p,todayISO());save();
  toast(`Đã xếp lại ${r.placed} buổi${r.last?" · xong dự kiến "+fmtD(r.last):""}${r.late?" · ⚠️ trễ hạn":""}`)}
function planToggle(pid){const p=planById(pid);if(!p)return;
  if(p.status==="off"){p.status="on";schedulePlan(p,todayISO())}
  else{p.status="off";state.tasks=state.tasks.filter(t=>!(t.plan===pid&&t.status!=="done"))}
  closeSheet();save()}
function planDelete(pid){if(!confirm("Xoá mục tiêu này và các buổi chưa làm?"))return;
  state.plans=(state.plans||[]).filter(p=>p.id!==pid);

async function pAI(){

  if(!p){p={id:"pl"+uid(),created:todayISO(),status:"on"};state.plans.push(p)}

   ${r.late?`<div class="verdict bad">Theo nhịp này sẽ trễ hạn ${fmtD(p.due)}. Tăng giờ/tuần, thêm ngày, hoặc thu hẹp mục tiêu — đừng nhồi.</div>`:`<div class="verdict ok">Mỗi ngày mở tab Hôm nay là thấy buổi cần làm.</div>`}
   <div class="note" style="margin-top:10px">Lỡ buổi nào thì cuối ngày bấm <b>Chốt ngày</b> hoặc <b>Xếp lại</b> — app dồn phần còn lại sang lịch mới, không bỏ bước nào.</div>

const AI_LS="son-study-os-ai";          // kept apart from state: never synced, never exported
const AI_MODELS=[["claude-opus-5","Claude Opus 5 — tốt nhất (mặc định)"],["claude-sonnet-5","Claude Sonnet 5 — rẻ hơn"]];
function aiCfg(){try{return JSON.parse(localStorage.getItem(AI_LS)||"{}")||{}}catch(e){return{}}}
function aiSetCfg(c){try{localStorage.setItem(AI_LS,JSON.stringify(c))}catch(e){}}
const PLAN_SCHEMA={type:"object",additionalProperties:false,required:["summary","tips","steps"],properties:{
  summary:{type:"string"},
  tips:{type:"array",items:{type:"string"}},
  steps:{type:"array",items:{type:"object",additionalProperties:false,required:["phase","t","min","how","out"],properties:{
    phase:{type:"string"},t:{type:"string"},min:{type:"integer"},how:{type:"string"},out:{type:"string"}}}}}};
const PLAN_SYSTEM=`Bạn là người lập kế hoạch cho một sinh viên năm cuối ngành tài chính ở Việt Nam (đang học 2 môn cuối, lớp Data Analytics, IELTS, tiếng Trung; hướng tới Investment Analyst). Việc của bạn: chia một mục tiêu dài hạn thành các buổi làm việc cụ thể, theo đúng thứ tự, mỗi buổi làm xong trong một lần ngồi.

Người này đang sửa 5 thói quen: thiếu kiên nhẫn (muốn nhanh), không tập trung (ôm đồm), làm không tới nơi tới chốn, giao du chưa chọn lọc, không giữ năng lượng. Kế hoạch phải giúp sửa các điểm đó:
- Mỗi buổi chỉ một việc chính, có đầu ra kiểm chứng được (bài viết, file, điểm số, bản ghi âm, bảng tính…). Không có buổi kiểu "tìm hiểu", "ôn chung chung", "xem video".
- Buổi sau xây trên buổi trước. Khoảng mỗi 2 tuần có một buổi kiểm tra thật (tự test, mock, nộp sản phẩm cho người khác xem) để đo tiến bộ.
- Nhịp đều, vừa sức, không nhồi. Nếu quỹ thời gian không đủ để đạt mục tiêu trước hạn, nói thẳng trong summary và đề xuất thu hẹp phạm vi — đừng hứa kết quả nhanh.
- Ở vài buổi phù hợp, gợi ý làm cùng hoặc xin góp ý từ người giỏi hơn (mentor, bạn học nghiêm túc).

Trường dữ liệu: phase = tên giai đoạn ngắn; t = tên buổi (ngắn, bắt đầu bằng động từ); min = số phút; how = làm cụ thể thế nào (1–2 câu); out = "xong khi…" (đầu ra đo được). summary = 2–3 câu nhận xét thẳng thắn về độ khả thi. tips = 3–5 lời khuyên giữ nhịp riêng cho mục tiêu này. Viết tiếng Việt, ngắn gọn, cụ thể.`;
function planUserMsg(d,existing){
  const av=sessionsAvail(d), t=todayISO();
  const ex=(existing||[]).length?`\n\nĐã có ${existing.length} buổi trong kế hoạch (${existing.filter(s=>s.done).length} đã xong):\n${existing.map((s,i)=>`${i+1}. ${s.done?"[xong] ":""}${s.t}`).join("\n")}\nHãy tạo TIẾP các buổi sau đó, không lặp lại.`:"";
  return `Mục tiêu: ${d.name}
Vì sao: ${d.why||"(không ghi)"}
Hiện tại / tài liệu có sẵn: ${d.ctx||"(không ghi)"}
Hôm nay: ${t}. Bắt đầu từ: ${d.from||t}. Hạn: ${d.due||"không có hạn cứng — lên kế hoạch cho khoảng 10 tuần đầu"}.
Quỹ thời gian: ${d.hpw} giờ/tuần, các ngày ${(d.days||[]).map(n=>WD[n]).join(", ")}, mỗi buổi ${d.sess} phút ⇒ khoảng ${av.perWk} buổi/tuần.
Tạo khoảng ${av.n} buổi (tối đa 80). Mỗi buổi min ≤ ${d.sess} phút, chỉ vượt khi thật sự bắt buộc.${ex}`;
}
function copyPrompt(d){
  return PLAN_SYSTEM+"\n\n---\n\n"+planUserMsg(d,d.steps)+`\n\nChỉ trả lời bằng MỘT khối JSON đúng dạng sau, không kèm chữ nào khác:
{"summary":"...","tips":["..."],"steps":[{"phase":"...","t":"...","min":45,"how":"...","out":"..."}]}`;
}
async function aiBreakdown(d,existing){
  const c=aiCfg();
  let Anthropic;
  try{ ({default:Anthropic}=await import(AI_SDK)); }
  catch(e){ throw new Error("Không tải được thư viện AI (mạng chặn cdn.jsdelivr.net?). Dùng 📋 thay thế."); }
  const client=new Anthropic({apiKey:c.key,dangerouslyAllowBrowser:true});
  const model=c.model||"claude-opus-5";
  const req={model,max_tokens:16000,system:PLAN_SYSTEM,
    messages:[{role:"user",content:planUserMsg(d,existing)}],
    output_config:{format:{type:"json_schema",schema:PLAN_SCHEMA}}};
  let res;
  try{
    res= model==="claude-opus-5"
      ? await client.beta.messages.create({...req,betas:["server-side-fallback-2026-07-01"],fallbacks:"default"})
      : await client.messages.create(req);
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError) throw new Error("API key sai hoặc đã bị thu hồi — kiểm tra lại trong Cài đặt.");
    if(e instanceof Anthropic.PermissionDeniedError) throw new Error("Key không có quyền dùng model này. Đổi model trong Cài đặt.");
    if(e instanceof Anthropic.RateLimitError) throw new Error("Đang gọi quá nhanh / hết hạn mức. Đợi 1 phút rồi thử lại.");
    if(e instanceof Anthropic.BadRequestError) throw new Error("Yêu cầu bị từ chối: "+(e.message||"")+" (hết credit thì nạp ở console.anthropic.com).");
    if(e instanceof Anthropic.APIConnectionError) throw new Error("Không kết nối được tới Claude. Kiểm tra mạng rồi thử lại.");
    if(e instanceof Anthropic.APIError) throw new Error("Claude đang lỗi ("+(e.status||"?")+"). Thử lại sau ít phút.");
    throw e;
  }
  if(res.stop_reason==="refusal") throw new Error("AI không xử lý yêu cầu này — thử diễn đạt lại mục tiêu.");
  if(res.stop_reason==="max_tokens") throw new Error("Kế hoạch quá dài bị cắt giữa chừng — rút ngắn hạn hoặc chia mục tiêu nhỏ hơn.");
  const txt=res.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  let o; try{o=JSON.parse(txt)}catch(e){throw new Error("AI trả về dữ liệu hỏng — bấm ✨ lần nữa.")}
  return o;
}
function saveAI(){
  const c=aiCfg(), k=v("aiK").trim();
  if(k)c.key=k; c.model=v("aiM")||"claude-opus-5"; aiSetCfg(c); toast("Đã lưu cài đặt AI trên máy này");
}
function clearAI(){aiSetCfg({});openSettings();toast("Đã xoá API key khỏi máy này")}
