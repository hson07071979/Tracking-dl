/* ======================= PROMPT BUILDER: study prompts for AI tools ======================= */
const PB_SUBJ={IF:"International Finance (ECON3014, giáo trình Eiteman–Stonehill–Moffett)",BF:"Banking and Finance (FINC3022, giáo trình Saunders & Cornett 11e)",
  IELTS:"IELTS Academic, mục tiêu 7.0",MACRO:"Macro & Equity Thinking (vĩ mô → thị trường → ngành)",DA:"Data Analytics (Python, pandas, thống kê)",LIFE:"Khác"};
const PB_TOOLS={nlm:["NotebookLM","https://notebooklm.google.com/"],claude:["Claude","https://claude.ai/new"],gpt:["ChatGPT","https://chatgpt.com/"],gemini:["Gemini","https://gemini.google.com/"]};
const PB_PURPOSE=[
 {k:"summary",l:"Tóm tắt bài giảng",tool:"nlm",need:""},
 {k:"video",l:"Video Overview",tool:"nlm",need:""},
 {k:"explain",l:"Giải thích chỗ chưa hiểu",tool:"claude",need:"Dán đoạn / câu bạn chưa hiểu"},
 {k:"quiz",l:"Tạo câu hỏi / đề thử",tool:"nlm",need:""},
 {k:"diff",l:"So slide thầy với bài tóm tắt",tool:"nlm",need:""},
 {k:"check",l:"Chấm bài tôi đã làm",tool:"claude",need:"Dán đề + bài làm của bạn"},
 {k:"cards",l:"Flashcard Anki",tool:"claude",need:""},
 {k:"record",l:"Tóm tắt record buổi học",tool:"gemini",need:""},
 {k:"ieltsW",l:"IELTS · chấm Writing",tool:"claude",need:"Dán đề + bài viết",subj:"IELTS"},
 {k:"ieltsS",l:"IELTS · luyện Speaking",tool:"gpt",need:"",subj:"IELTS"},
 {k:"macro",l:"Macro · phản biện chuỗi nhân quả",tool:"claude",need:"Dán headline + chuỗi nhân quả bạn viết",subj:"MACRO"}
];
const PB_LEVEL={new:"mới học lần đầu, cần hiểu bản chất",review:"đang ôn lại, cần hệ thống và luyện tập",exam:"sát ngày thi, cần tập trung vào dạng hay ra đề và lỗi hay sai"};
let pb=null;
function pbCurrentTopic(subj){
  const t=todayISO(), n=sessOfWeek(mondayOf(t)); if(!n) return "";
  if(subj==="IF"||subj==="BF"){ const W=subj==="IF"?IF_W:BF_W, cd=subj==="IF"?6:5, k=dow(t)>=cd?n:n-1; return W[k]?`S${k} · ${W[k][0]} (${W[k][1]})`:""; }
  return "";
}
function openPromptBuilder(pre){
  pre=pre||{};
  const subj=pre.subj||(pb&&pb.subj)||"IF";
  pb={subj,topic:pre.topic!=null?pre.topic:pbCurrentTopic(subj),purpose:pre.purpose||"summary",level:pre.level||"review",input:"",out:""};
  renderPB();
}
function pbRead(){ if(!pb||!document.getElementById("pbS"))return; pb.subj=v("pbS"); pb.topic=v("pbT"); pb.level=v("pbL"); pb.input=v("pbI"); }
function pbSet(k,val){ pbRead(); pb[k]=val; const P=PB_PURPOSE.find(x=>x.k===pb.purpose); if(k==="purpose"&&P&&P.subj){pb.subj=P.subj}
  if(k==="subj"){pb.topic=pbCurrentTopic(val)} renderPB(); }
function buildPrompt(p){
  const P=PB_PURPOSE.find(x=>x.k===p.purpose)||PB_PURPOSE[0], S=PB_SUBJ[p.subj]||p.subj, T=p.topic?` — chủ đề: ${p.topic}`:"", L=PB_LEVEL[p.level];
  const base=`Tôi là sinh viên năm cuối ngành tài chính ở Việt Nam, học bằng tiếng Anh. Môn: ${S}${T}. Mức độ: ${L}.`;
  const src="Chỉ dựa trên tài liệu tôi đã đưa (slide, bài tóm tắt). Chỗ nào tài liệu không có thì nói rõ là không có, đừng tự bịa.";
  const vn="Trả lời bằng tiếng Việt, giữ nguyên thuật ngữ tiếng Anh (lần đầu xuất hiện thì giải thích ngắn).";
  const inp=p.input.trim()?`\n\n---\nNội dung của tôi:\n${p.input.trim()}`:"";
  switch(P.k){
    case "summary": return `${base}\n${src}\n${vn}\n\nHãy tóm tắt bài giảng này theo đúng thứ tự:\n1. Bức tranh lớn trong 3 câu.\n2. 4–6 khái niệm cốt lõi, mỗi khái niệm: định nghĩa, vì sao quan trọng, 1 ví dụ.\n3. Toàn bộ công thức, ghi rõ đơn vị và cách đọc từng ký hiệu.\n4. 5 lỗi sinh viên hay nhầm khi làm trắc nghiệm.\n5. 3 câu hỏi để tôi tự kiểm tra (chưa đưa đáp án).${inp}`;
    case "video": return `Tạo Video Overview cho ${S}${T}.\nKhán giả: sinh viên năm cuối, mức độ: ${L}.\nNói tiếng Việt, giữ thuật ngữ tiếng Anh. Thứ tự: bức tranh lớn → 3–5 khái niệm cốt lõi → 1 ví dụ số làm từng bước → các lỗi hay nhầm → 3 câu hỏi cuối video.\nKhông thêm kiến thức ngoài tài liệu đã nạp.`;
    case "explain": return `${base}\n${vn}\n\nTôi chưa hiểu phần dưới đây. Hãy giải thích theo 3 tầng:\n1. Giải thích như cho người mới (dùng một phép so sánh đời thường).\n2. Giải thích đúng chuẩn giáo trình, có công thức hoặc cơ chế.\n3. Một ví dụ số làm từng bước.\nSau đó hỏi tôi 2 câu để kiểm tra tôi đã hiểu chưa, và chờ tôi trả lời.${inp||"\n\n---\nNội dung tôi chưa hiểu: (dán vào đây)"}`;
    case "quiz": return `${base}\n${src}\n\nTạo 10 câu hỏi kiểm tra cho chủ đề này:\n- 6 câu trắc nghiệm 4 lựa chọn, đúng kiểu đề thi (có bẫy), trong đó ít nhất 3 câu có tính toán.\n- 2 câu tính toán nhiều bước.\n- 2 câu tự luận ngắn (giải thích, đánh giá).\nChưa đưa đáp án. Khi tôi trả lời xong thì chấm từng câu, giải thích câu sai, và chỉ ra tôi đang hổng phần nào.\nDùng số liệu mới, không lặp lại số liệu có sẵn trong slide.`;
    case "diff": return `${base}\nTôi đã nạp 2 nguồn: slide của giảng viên, và bài tóm tắt tôi tự ôn.\n\nHãy so sánh và liệt kê:\n1. Nội dung có trong slide giảng viên nhưng bài tóm tắt KHÔNG có (xếp theo mức quan trọng cho thi).\n2. Chỗ hai nguồn nói khác nhau hoặc dùng số liệu khác nhau.\n3. Ví dụ, bảng, case riêng của giảng viên (thường là chỗ dễ ra đề).\nMỗi ý ghi rõ trích từ slide số mấy.`;
    case "check": return `${base}\n${vn}\n\nChấm bài làm của tôi như một giảng viên khắt khe:\n- Kiểm tra từng bước tính và từng lập luận. Chỉ ra đúng chỗ sai đầu tiên và vì sao sai.\n- Không viết lại lời giải hoàn chỉnh. Chỉ gợi ý bước tiếp theo để tôi tự sửa.\n- Cuối cùng cho điểm trên 10 và nêu 1 thói quen cần sửa.${inp||"\n\n---\nĐề bài và bài làm của tôi: (dán vào đây)"}`;
    case "cards": return `${base}\n${src}\n\nTạo 20 flashcard cho Anki, mỗi dòng dạng: mặt trước;mặt sau\n- Mặt trước là một câu hỏi ngắn hoặc thuật ngữ (tiếng Anh).\n- Mặt sau trả lời ngắn gọn bằng tiếng Việt, có công thức nếu có.\n- Gồm: định nghĩa, công thức, dấu và chiều tác động, các cặp khái niệm dễ nhầm.\nChỉ in các dòng flashcard, không thêm chữ nào khác.`;
    case "record": return `Đây là record buổi học ${S}${T}.\n1. Tóm tắt theo mốc thời gian (mm:ss), mỗi mốc 1–2 câu.\n2. Liệt kê những chỗ giảng viên nhấn mạnh, nhắc lại, hoặc nói "cái này hay ra đề".\n3. Liệt kê mọi ví dụ, bài tính, đoạn code giảng viên làm, kèm mốc thời gian.\n4. Câu hỏi sinh viên hỏi và câu trả lời.\nTrả lời bằng tiếng Việt, giữ thuật ngữ tiếng Anh.`;
    case "ieltsW": return `You are a strict IELTS examiner. Grade this Academic Writing response using the public band descriptors (Task Response / Task Achievement, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy).\n- Give a band for each criterion and explain why it is not one band higher, quoting my sentences.\n- List my 3 highest-priority fixes.\n- Do NOT rewrite the whole essay. Rewrite only one example sentence per fix.\nMy target is band 7.0. Explanations may be in Vietnamese.${inp||"\n\n---\nTask + my essay: (paste here)"}`;
    case "ieltsS": return `Act as an IELTS Speaking examiner. Run a full test: Part 1 (4 questions), Part 2 (give me a cue card, 1 minute to prepare, I speak for 2 minutes), Part 3 (4 questions). Do not correct me during the test.\nAfter the test: estimated band per criterion (Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation), my 3 most frequent errors with examples, and 3 phrases I should start using. My target is 7.0.`;
    case "macro": return `${base}\n${vn}\n\nPhản biện chuỗi nhân quả vĩ mô dưới đây:\n1. Chỉ ra mắt xích nào đang nhảy cóc hoặc là narrative chứ không phải cơ chế.\n2. Tin này chạm vào cửa nào: (a) lợi nhuận, (b) lãi suất chiết khấu, (c) phần bù rủi ro / thanh khoản?\n3. Ai được, ai mất, và nhánh ngược mà tôi bỏ sót.\n4. Thị trường có thể đã phản ánh vào giá bao nhiêu rồi? Dựa vào tín hiệu giá nào?\nĐừng viết lại chuỗi cho tôi. Chỉ hỏi và chỉ ra chỗ sai.${inp||"\n\n---\nHeadline + chuỗi nhân quả của tôi: (dán vào đây)"}`;
  }
  return base;
}
function renderPB(msg){
  const P=PB_PURPOSE.find(x=>x.k===pb.purpose)||PB_PURPOSE[0], tool=PB_TOOLS[P.tool], out=buildPrompt(pb);
  const bfWarn=pb.subj==="BF";
  openSheet(`<h3>✨ Tạo prompt học với AI</h3><div class="sh-sub">Chọn mục đích → copy → dán vào tool gợi ý. Prompt đã có sẵn nguyên tắc: dựa trên tài liệu, không làm hộ.</div>
   <div class="fld"><span class="mlab">Mục đích</span><div class="pill-row">${PB_PURPOSE.map(x=>`<button type="button" class="pill ${x.k===pb.purpose?"on":""}" onclick="pbSet('purpose','${x.k}')">${x.l}</button>`).join("")}</div></div>
   <div class="two"><label class="fld"><span>Môn</span><select id="pbS" onchange="pbSet('subj',this.value)">${Object.keys(PB_SUBJ).map(k=>`<option value="${k}" ${pb.subj===k?"selected":""}>${k==="BF"?"BFN":k}</option>`).join("")}</select></label>
     <label class="fld"><span>Mức độ</span><select id="pbL" onchange="pbSet('level',this.value)">${[["new","Mới học"],["review","Đang ôn"],["exam","Sát thi"]].map(([k,l])=>`<option value="${k}" ${pb.level===k?"selected":""}>${l}</option>`).join("")}</select></label></div>
   <label class="fld"><span>Chương / chủ đề</span><input type="text" id="pbT" value="${h(pb.topic)}" placeholder="VD: S6 · Market Risk (Ch.15)" onchange="pbSet('topic',this.value)"></label>
   ${P.need?`<label class="fld"><span>${h(P.need)}</span><textarea id="pbI" oninput="pbRead()" onchange="pbSet('input',this.value)" placeholder="Dán vào đây (không bắt buộc, có thể dán thẳng trong tool)">${h(pb.input)}</textarea></label>`:`<input type="hidden" id="pbI" value="">`}
   ${bfWarn?`<div class="warnbox" style="margin-bottom:10px">BFN <b>cấm AI trong bài chấm điểm</b>. Chỉ dùng để tự hiểu và luyện problems. <b>Không</b> dán đề Report hay nội dung thuyết trình.</div>`:""}
   ${pb.subj==="IF"&&pb.purpose==="check"?`<div class="note" style="margin-bottom:10px">IF được dùng AI nhưng phải <b>khai báo</b> nếu dùng trong bài nộp.</div>`:""}
   <div class="mblk out"><span class="mlab">Dán vào ${tool[0]}</span><textarea id="pbOut" readonly style="min-height:190px;font-size:12.5px;background:var(--surface)">${h(out)}</textarea></div>
   <div class="row wrap" style="gap:7px">
     <button class="btn primary grow" onclick="pbRead();document.getElementById('pbOut').value=buildPrompt(pb);copyText('pbOut')">Copy prompt</button>
     <a class="btn grow" href="${tool[1]}" target="_blank" rel="noopener">Mở ${tool[0]} ↗</a></div>
   ${P.tool==="nlm"?`<div class="small muted" style="margin-top:8px">NotebookLM: nạp slide (PDF) + link bài tóm tắt của chương vào notebook của môn trước, rồi dán prompt vào ô chat (Video Overview thì dán vào ô tuỳ chỉnh của Video Overview).</div>`:""}
   <div class="sheet-foot"><button class="btn ghost" onclick="closeSheet()">Đóng</button></div>`);
}

/* ================================= BOOT ================================= */
render();
initCloud();
</script>
