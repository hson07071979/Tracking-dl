/* ===================================================
   STUDY KIT v2 — native, single-page, no context switching
   =================================================== */
.study-shortcuts{display:flex;gap:8px;flex-wrap:wrap;padding:13px 0 2px;align-items:center}
.study-shortcuts .studylbl{font-size:11px;font-weight:800;color:var(--ink3);margin-right:3px}
.study-shortcuts a{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border-radius:100px;padding:8px 13px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-weight:800;font-size:11px;transition:transform .18s,background .18s}
.study-shortcuts a:hover{transform:translateY(-2px);background:var(--lav);color:var(--primary)}
.study-kicker{font-size:10px;font-weight:900;letter-spacing:.11em;color:var(--primary);text-transform:uppercase;margin-bottom:5px}
.study-inline-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.study-inline-head .hintline{margin:0}
.study-inline-note{border:1px dashed #b6b0eb;background:var(--surface2);border-radius:14px;padding:12px 16px;font-size:11px;color:var(--ink2);line-height:1.9}
.study-reader-wrap{display:grid;grid-template-columns:222px minmax(0,1fr);gap:13px;align-items:stretch;min-width:0;scroll-margin-top:98px}
.study-file-nav{padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0;align-self:stretch}
.study-file-nav .nav-caption{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:8px 8px 2px}
.study-file-btn{padding:11px 10px;text-align:left;display:flex;gap:10px;border:1px solid transparent;background:transparent;border-radius:12px;width:100%;align-items:flex-start;transition:.15s}
.study-file-btn:hover{background:var(--surface2)}
.study-file-btn.active{border-color:#d7d1ff;background:var(--lav)}
.study-file-btn .sf-ico{width:34px;height:34px;display:grid;place-items:center;flex-shrink:0;border-radius:10px;background:#ffedf1;font-size:16px}
.study-file-btn.excel .sf-ico{background:#e1f5e9}
.study-file-btn .sf-name{display:block;line-height:1.43;font-size:11.5px;font-weight:800;color:var(--ink)}
.study-file-btn .sf-sub{display:block;font-size:9.5px;color:var(--ink3);margin-top:4px;line-height:1.3}
.study-file-btn .sf-check{font-size:9px;color:var(--mintink);font-weight:800;white-space:nowrap}
.study-file-nav .study-nav-tip{font-size:10px;color:var(--ink3);line-height:1.7;padding:10px 9px;margin-top:auto;border-radius:12px;background:var(--surface2)}
.study-reader-panel{min-width:0;overflow:hidden;padding:0}
.reader-top{padding:17px 19px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.reader-top h3{font-size:16px;font-weight:900;margin:0;line-height:1.4}
.reader-top .hintline{font-size:10px;margin:5px 0 0;max-width:520px}
.reader-main-actions{display:flex;flex-wrap:wrap;gap:6px}
.study-control{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);padding:8px 10px;font-size:10.5px;font-weight:800;white-space:nowrap;min-height:31px}
.study-control:hover{background:var(--lav)}
.study-control.active{background:var(--primary);border-color:var(--primary);color:#fff}
.study-control:disabled{opacity:.3}
.reader-toolbar{padding:10px 17px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.reader-toolbar label,.reader-toolbar .page-indicator{font-size:10.5px;font-weight:800;color:var(--ink2)}
.reader-toolbar .spacer{flex:1}
.reader-toolbar .reader-count{font-size:10px;font-weight:900;color:var(--primary);padding:0 3px}
.reader-toolbar .reader-pagenum{width:51px;height:31px;border:1px solid var(--line);border-radius:8px;text-align:center;background:var(--surface);color:var(--ink);font:800 11px var(--font);padding:4px}
.reader-searchbar{padding:10px 17px;background:var(--surface2);border-bottom:1px solid var(--line)}
.reader-searchbar input{width:100%;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:11px;background:var(--surface);color:var(--ink);outline:0}
.reader-searchbar input:focus{border-color:var(--primary)}
.reader-hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.reader-hits:empty{display:none}
.reader-hit{border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:10px;font-weight:800;padding:6px 10px;color:var(--primary)}
.reader-scroll{height:min(76vh,810px);min-height:410px;background:#ececf3;overflow:auto;position:relative;scrollbar-color:#d3d0e7 transparent;overscroll-behavior:contain}
[data-theme=dark] .reader-scroll{background:#191a2d}
.study-native-pages{display:flex;flex-direction:column;gap:15px;align-items:center;padding:18px}
.study-native-page{background:transparent;min-height:45px;display:flex;align-items:center;flex-direction:column;width:100%;scroll-margin-top:18px}
.study-native-page .page-label{align-self:center;color:#7d798d;font-size:9.5px;letter-spacing:.1em;font-weight:900;margin-bottom:5px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.75);border-radius:80px;padding:3px 9px}
.study-native-page img{display:block;height:auto;max-width:none;object-fit:contain;background:#fff;box-shadow:0 6px 26px rgba(47,41,91,.16);border-radius:4px}
.study-native-page .docimg-placeholder{padding:36px;text-align:center;background:#fff;border-radius:5px;box-shadow:var(--shade);width:min(100%,500px);color:var(--ink3);font-size:12px}
.reader-pages-note{font-size:10px;font-weight:600;color:var(--ink3);text-align:center;padding:12px 14px;background:var(--surface2);line-height:1.7;border-top:1px solid var(--line)}
.native-text-page{width:100%;max-width:850px;background:#fff;color:#22263b;border-radius:8px;padding:20px 25px;box-shadow:0 4px 22px rgba(50,40,80,.08);margin:0 auto 10px;scroll-margin-top:14px}
.native-text-page h4{font-size:11px;font-weight:900;color:#6d5fbc;margin:0 0 12px;border-bottom:1px solid #eae7f1;padding-bottom:8px}
.native-text-page pre{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:12px;line-height:1.9;color:#333;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;tab-size:2}
.native-text-page .no-text{color:#888;font-style:italic;font-size:11px}
.excel-subnav{padding:11px 15px;display:flex;gap:6px;flex-wrap:wrap;background:var(--surface2);border-bottom:1px solid var(--line)}
.excel-subnav button{border-radius:9px;padding:7px 10px;border:1px solid var(--line);background:var(--surface);font-size:10px;font-weight:800;color:var(--ink2)}
.excel-subnav button.active{background:#e4f8ed;border-color:#a5dfb5;color:#2b7656}
.excel-viewport{height:min(76vh,810px);min-height:380px;overflow:auto;background:#f9fafb;scrollbar-color:#c6d8cf transparent}
.excel-table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content;font-family:Arial,sans-serif;font-size:11px;color:#1e293b}
.excel-table th,.excel-table td{border-right:1px solid #e0e6e4;border-bottom:1px solid #e0e6e4;white-space:pre-wrap;overflow-wrap:anywhere;max-width:370px;min-width:105px;vertical-align:top;padding:8px 10px;background:#fff}
.excel-table th{position:sticky;top:0;background:#e7f4ed;z-index:2;color:#4a7460;text-align:center;font-weight:800}
.excel-table th:first-child{position:sticky;left:0;z-index:4;min-width:42px;width:42px}
.excel-table .xls-rownum{position:sticky;left:0;z-index:1;background:#eef6f1;color:#6b7e74;text-align:right;min-width:42px;width:42px}
.excel-table .xls-label{font-weight:700;color:#23483c;min-width:165px}
.excel-table .xls-numeric{text-align:right;font-variant-numeric:tabular-nums;color:#244a91}
.excel-table .xls-empty{background:#fdfefd;color:#cbd5ce}
.excel-table .xls-strong{font-weight:900;background:#eaf4f0}
.excel-table .xls-note{min-width:230px;color:#7a575a}
.excel-table .xls-alert{color:#a54a3a;background:#fff0e8}
.study-unit-inline{padding:16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:120px}
.study-unit-inline .unitintro{font-size:10.5px;color:var(--ink2);line-height:1.65;margin:0}
.study-unit-inline .unitnum{margin:0}
.study-steps{display:grid;gap:7px;padding:0;margin:0;list-style:none}

ont-variant-numeric: lining-nums tabular-nums;\n}\ntable caption {\nmargin-bottom: 0.75em;\n}\ntbody {\nmargin-top: 0.5em;\nborder-top: 1px solid #1a1a1a;\nborder-bottom: 1px solid #1a1a1a;\n}\nth {\nborder-top: 1px solid #1a1a1a;\npadding: 0.25em 0.5em 0.25em 0.5em;\n}\ntd {\npadding: 0.125em 0.5em 0.25em 0.5em;\n}\nheader {\nmargin-bottom: 4em;\ntext-align: center;\n}\n#TOC li {\nlist-style: none;\n}\n#TOC ul {\npadding-left: 1.3em;\n}\n#TOC > ul {\npadding-left: 0;\n}\n#TOC a:not(:hover) {\ntext-decoration: none;\n}\ncode{white-space: pre-wrap;}\nspan.smallcaps{font-variant: small-caps;}\ndiv.columns{display: flex; gap: min(4vw, 1.5em);}\ndiv.column{flex: auto; overflow-x: auto;}\ndiv.hanging-indent{margin-left: 1.5em; text-indent: -1.5em;}\n\nul.task-list[class]{list-style: none;}\nul.task-list li input[type=\"checkbox\"] {\nfont-size: inherit;\nwidth: 0.8em;\nmargin: 0 0.8em 0.2em -1.6em;\nvertical-align: middle;\n}\n.display.math{display: block; text-align: center; margin: 0.5rem auto;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cp>\u003cstrong>Practice Questions\u003c/strong>\u003c/p>\n\u003cp id=\"q1\">\u003cstrong>Question 1\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Show your work in detail to get full credit.\u003c/strong>\u003c/p>\n\u003cp>Hoàng Long Partners, a U.S.-based private equity fund, borrows\nCHF50,000,000 at a time when the exchange rate is US$1.1200/CHF. The\nentire principal is to be repaid in three years, and interest is 1.50%\nper annum, paid annually in Swiss francs. The Swiss franc is expected to\nappreciate vis-à-vis the dollar at 3.0% per annum.\u003c/p>\n\u003cp>a) What is the expected exchange rate, US$/CHF, in years 1, 2, and 3?\n(10 marks)\u003c/p>\n\u003cp>b) What is the effective cost of this loan for Hoàng Long Partners?\n(15 marks)\u003c/p>\n\u003cp id=\"q2\">\u003cstrong>Question 2\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Show your work in detail to get full credit.\u003c/strong>\u003c/p>\n\u003cp>Sao Việt Furniture JSC has sold wooden furniture to a buyer in\nGermany for US$400,000, with payment due in 120 days. The company has\nthe following alternatives for financing this receivable: 1) use its\nbank credit line, with interest at the prime rate of 5.00% plus 150\nbasis points per annum and a compensating balance of 12% of the loan's\nface amount (the bank pays no interest on the compensating balance); or\n2) have a bank accept the time draft and discount the banker's\nacceptance at an annual discount rate of 1.80% (no compensating balance\nis required). Use a 360-day year.\u003c/p>\n\u003cp>a) What are the annualized percentage all-in costs of each\nalternative? (15 marks)\u003c/p>\n\u003cp>b) What are the advantages and disadvantages of each alternative? (5\nmarks)\u003c/p>\n\u003cp>c) Which alternative would you recommend? (5 marks)\u003c/p>\n\u003cp id=\"q3\">\u003cstrong>Question 3\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Show your work in detail to get full credit.\u003c/strong>\u003c/p>\n\u003cp>Sunrise Furniture Inc. is a U.S.-based manufacturer of outdoor\nfurniture. In March, it ships a large order to a distributor in Hamburg,\nGermany. The receivable of €5,000,000 is payable in 90 days, which is\nstandard trade credit in the industry. The treasury department has\ncollected the following market information (use a 360-day year and\nsimple interest).\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 79%\">\n\u003ccol style=\"width: 20%\">\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>\u003cstrong>Market information\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>Value\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Current spot rate (US$/€)\u003c/td>\n\u003ctd>1.0800\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Bank A 90-day forward rate (US$/€)\u003c/td>\n\u003ctd>1.0720\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Bank B 90-day forward rate (US$/€)\u003c/td>\n\u003ctd>1.0745\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>U.S. investment (deposit) rate\u003c/td>\n\u003ctd>4.00% p.a.\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>U.S. borrowing rate\u003c/td>\n\u003ctd>7.00% p.a.\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>90-day euro borrowing rate\u003c/td>\n\u003ctd>6.00% p.a.\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>90-day put option on euros: strike price (US$/€)\u003c/td>\n\u003ctd>1.0750\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Put option premium (US$ per €)\u003c/td>\n\u003ctd>0.0160\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The company's foreign exchange consultant forecasts that the euro\nwill trade at approximately US$1.0900/€ in 90 days.\u003c/p>\n\u003cp>Advise Sunrise Furniture on the most appropriate strategy for\nmanaging its exchange rate exposure among the following\nalternatives:\u003c/p>\n\u003cp>(i) Remain unhedged;\u003c/p>\n\u003cp>(ii) Hedge using a forward contract;\u003c/p>\n\u003cp>(iii) Hedge using a money market hedge;\u003c/p>\n\u003cp>(iv) Hedge using a put option (consider possible spot rates in 90\ndays of US$1.0200/€, US$1.0750/€ and US$1.1400/€).\u003c/p>\n\u003cp>Marks: alternative (i) 5 marks; (ii) 5 marks; (iii) 6 marks; (iv) 6\nmarks. Provide a final recommendation (3 marks).\u003c/p>\n\u003cp id=\"q4\">\u003cstrong>Question 4\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Show your work in detail to get full credit.\u003c/strong>\u003c/p>\n\u003cp>Saigon Coffee Roasters JSC (Vietnam) has exported roasted coffee to a\ndistributor in Canada for US$320,000, with payment due in 150 days. To\nfinance this accounts receivable, the company has two alternatives: (1)\nuse its bank credit line, with interest at the prime rate of 5.0% plus\n250 basis points per annum; or (2) use its bank credit line but purchase\nexport credit insurance for a fee of 0.8%. Because of the reduced risk,\nthe bank interest rate would be reduced to the prime rate of 5.0% per\nannum without any points. In both alternatives, Saigon Coffee Roasters\nwould need to maintain a compensating balance of 10% of the loan's face\namount. No interest will be paid on the compensating balance by the\nbank.\u003c/p>\n\u003cp>a) What are the annualized percentage all-in-costs of each\nalternative? (15 marks)\u003c/p>\n\u003cp>b) What are the advantages and disadvantages of each alternative? (5\nmarks)\u003c/p>\n\u003cp>c) Which alternative would you recommend? (5 marks)\u003c/p>\n\u003c/body>\n\u003c/html>"</script>

function parseDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return new Date();const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(date,n){const d=parseDate(date);d.setDate(d.getDate()+n);return dateISO(d)}
function dd(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000)}
function weekday(s){return ['CN','T2','T3','T4','T5','T6','T7'][parseDate(s).getDay()]}
function shortDate(s){const d=parseDate(s);return `${z(d.getDate())}/${z(d.getMonth()+1)}`}
function longDate(s){const d=parseDate(s);return `${weekday(s)}, ${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()}`}
function monday(s){const d=parseDate(s);return addDays(s,-((d.getDay()+6)%7))}

const sprintTaskId = (key, track) => (track === 'IF' ? 'nsi-if-1122-' : 'nsi-sprint-1123-') + key;
const scheduledSprintIds = new Set(SPRINT_DAYS.flatMap(([, blocks]) =>
  blocks.map(([key, track]) => sprintTaskId(key, track))));

function installStudySprint() {
  if (state.studySprintNov22DiHd) return;
  const previousIds = new Set(NSI_EXAM_TASKS.map(task => task.id));
  const existingIds = new Set(state.tasks.map(task => task.id));
  for (const task of state.tasks) {
    const superseded = previousIds.has(task.id) || task.id.startsWith('nsi-sprint-1123-if-');
    if (superseded && task.status !== 'done') task.archived = true;
  }
  for (const [date, blocks] of SPRINT_DAYS) {
    for (const [key, track, time, duration, t, note] of blocks) {
      const id = sprintTaskId(key, track);
      if (!existingIds.has(id)) {
        state.tasks.push({id, t, track, date, time, duration, note, pri: 5,
          status: 'todo', reminder: 15, archived: false, examSprint: true});
      }
    }
  }
  state.phaseStart = SPRINT_START;
  state.phaseEnd = SPRINT_END;
  state.studySprintNov22DiHd = true;
  save();
}

function ifNumber(n, digits = 2) {
  return n.toLocaleString('en-US', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}
const ifPct = n => ifNumber(100 * n, 3) + '%';
const ifUSD = n => 'USD ' + ifNumber(n);
const ifFX = n => ifNumber(n, 4);

function ifQuestionLoan([face, spot, couponRate, appreciation]) {
  const years = [1, 2, 3];
  const spots = years.map(year => spot * (1 + appreciation) ** year);
  const payments = spots.map((rate, i) => face * (couponRate + (i === 2 ? 1 : 0)) * rate);
  return {
    title:'Q1 · Vay CHF và effective USD borrowing cost',
    chapters:'Ch.14', marks:'10 + 15',
    prompt:`Hoàng Long Partners, a U.S.-based private equity fund, borrows CHF ${ifNumber(face,0)} at USD ${ifFX(spot)} per CHF. The principal is due in three years. Interest is ${ifPct(couponRate)} p.a., paid annually in CHF. The CHF is expected to appreciate by ${ifPct(appreciation)} p.a. against the USD. (a) What is the expected USD/CHF rate in years 1, 2 and 3? (b) What is the effective USD cost of the loan?`,
    answer:`<p><b>(a)</b> S<sub>t</sub> = S<sub>0</sub>(1 + g)<sup>t</sup>. Năm 1–3 lần lượt là ${spots.map(ifFX).join(' · ')} USD/CHF.</p>
    <p><b>(b)</b> Dòng tiền từ góc nhìn người vay: t₀ nhận ${ifUSD(face * spot)}. Năm 1–3 lần lượt trả ${payments.map(ifUSD).join(' · ')}. Năm 3 gồm cả gốc. Tìm IRR của dòng tiền USD hoặc dùng (1 + lãi CHF)(1 + mức CHF tăng giá) − 1 = <b>${ifPct((1 + couponRate) * (1 + appreciation) - 1)}</b>, do giả định tỷ giá tăng cùng một tốc độ mỗi năm. Giữ tỷ giá đầy đủ khi quy đổi.</p>`,
  };
}

function ifQuestionTrade([face, days, prime, spread, balance, discountRate]) {
  const fraction = days / 360;
  const bankProceeds = face * (1 - balance);
  const interest = face * (prime + spread / 10000) * fraction;
  const discount = face * discountRate * fraction;
  const acceptanceProceeds = face - discount;
  const creditCost = interest / bankProceeds / fraction;
  const acceptanceCost = discount / acceptanceProceeds / fraction;
  return {
    title:'Q2 · Credit line và banker’s acceptance',
    chapters:'Ch.16', marks:'15 + 5 + 5',
    prompt:`Sao Việt Furniture JSC sold furniture to a German buyer for ${ifUSD(face)}, payable in ${days} days. It can use a bank credit line at prime (${ifPct(prime)}) plus ${spread} bp p.a. with a non-interest-bearing ${ifPct(balance)} compensating balance, or discount a banker’s acceptance at ${ifPct(discountRate)} p.a. with no compensating balance. Use a 360-day year. (a) Calculate the annualized percentage all-in cost of each alternative. (b) Compare the advantages and disadvantages. (c) Recommend one alternative.`,
    answer:`<p><b>(a) Credit line</b>: số tiền dùng được ${ifUSD(bankProceeds)}. Lãi = face × (prime + bp/10,000) × days/360 = ${ifUSD(interest)}. All-in = lãi ÷ tiền dùng được × 360/days = <b>${ifPct(creditCost)}</b>.</p>
    <p><b>Banker’s acceptance</b>: trừ discount ${ifUSD(discount)} ngay đầu kỳ. Thu ròng ${ifUSD(acceptanceProceeds)}. All-in = discount ÷ thu ròng × 360/days = <b>${ifPct(acceptanceCost)}</b>.</p>
    <p><b>(b)–(c)</b> Credit line linh hoạt nếu đã có hạn mức, nhưng giữ tiền không sinh lãi và dùng hạn mức. Banker’s acceptance giúp thu tiền sớm nhưng cần hối phiếu và ngân hàng chấp nhận, nên xét thêm thủ tục và phí phát sinh. Theo số đã cho, chọn <b>${acceptanceCost < creditCost ? 'banker’s acceptance' : 'credit line'}</b> do chi phí thấp hơn.</p>`,
  };
}

function ifQuestionHedge([face, days, spot, forwardA, forwardB, deposit, usdBorrow, eurBorrow, strike, premium, forecast, scenarios]) {
  const fraction = days / 360;
  const bestForward = Math.max(forwardA, forwardB) * face;
  const eurNow = face / (1 + eurBorrow * fraction);
  const moneyMarket = eurNow * spot * (1 + deposit * fraction);
  const premiumNow = premium * face;
  const premiumFuture = premiumNow * (1 + usdBorrow * fraction);
  const floor = strike * face - premiumFuture;
  const alternativeFloor = strike * face - premiumNow * (1 + deposit * fraction);
  return {
    title:'Q3 · Phòng hộ khoản phải thu EUR',
    chapters:'Ch.10', marks:'5 + 5 + 6 + 6 + 3',
    prompt:`Sunrise Furniture Inc. has a receivable of EUR ${ifNumber(face,0)}, payable in ${days} days. Quotes are in USD/EUR: current spot ${ifFX(spot)}, Bank A forward ${ifFX(forwardA)}, Bank B forward ${ifFX(forwardB)}. The USD deposit and borrowing rates are ${ifPct(deposit)} and ${ifPct(usdBorrow)} p.a. The EUR borrowing rate is ${ifPct(eurBorrow)} p.a. The EUR put has strike ${ifFX(strike)} and premium ${ifFX(premium)} per EUR. The consultant forecasts spot of ${ifFX(forecast)} at maturity. Use simple interest and a 360-day year. Compare (i) unhedged, (ii) forward, (iii) money market hedge and (iv) put at spot rates ${scenarios.map(ifFX).join(' / ')}. Recommend a strategy.`,
    answer:`<p><b>(i) Unhedged</b>: theo dự báo ${ifUSD(face * forecast)}. Giá trị thực tế tùy spot cuối kỳ.</p>
    <p><b>(ii) Forward</b>: bán EUR kỳ hạn. A cho ${ifUSD(forwardA * face)}, B cho ${ifUSD(forwardB * face)}. Chọn Bank ${forwardA >= forwardB ? 'A' : 'B'}.</p>
    <p><b>(iii) Money market</b>: vay EUR ${ifNumber(eurNow)} hôm nay, bán spot để có ${ifUSD(eurNow * spot)}, gửi USD đến đáo hạn được <b>${ifUSD(moneyMarket)}</b>. Dùng EUR thu từ khách để trả cả gốc và lãi vay EUR.</p>
    <p><b>(iv) Put</b>: premium t₀ = ${ifUSD(premiumNow)}. Giả sử vay USD để trả premium, chi phí tₙ = ${ifUSD(premiumFuture)}. Thu ròng = số EUR phải thu × max(spot, strike) − premium tₙ. Spot ${scenarios.map(ifFX).join(' / ')} lần lượt cho <b>${scenarios.map(s => ifUSD(face * Math.max(s, strike) - premiumFuture)).join(' / ')}</b>. Tại strike có thể exercise hoặc đổi spot với cùng giá trị gộp. Nếu trả phí từ tiền mặt sẵn có, ghi rõ dùng lãi gửi làm chi phí cơ hội, khi đó sàn là ${ifUSD(alternativeFloor)}.</p>
    <p><b>Khuyến nghị</b>: nếu ưu tiên khoản thu USD chắc chắn cao nhất theo số đã cho, chọn <b>${moneyMarket >= bestForward ? 'money market hedge' : 'forward'}</b> (${ifUSD(Math.max(moneyMarket,bestForward))}). Put giữ upside nhưng sàn còn ${ifUSD(floor)} sau phí; unhedged có giá trị dự báo riêng và vẫn chịu rủi ro biến động.</p>`,
  };
}

function ifQuestionInsurance([face, days, prime, spread, balance, feeRate]) {
  const fraction = days / 360;
  const net = face * (1 - balance);
  const interestUninsured = face * (prime + spread / 10000) * fraction;
  const interestInsured = face * prime * fraction;
  const fee = face * feeRate;
  const uninsured = interestUninsured / net / fraction;
  const insured = (interestInsured + fee) / net / fraction;
  const insuredUpfront = (interestInsured + fee) / (net - fee) / fraction;
  return {
    title:'Q4 · Credit line có hoặc không có bảo hiểm',

function taskResourceLinks(task, compact = false) {
  const match = /^(?:nsi-if-1122-|nsi-sprint-1123-)(.+)$/.exec(task.id);

  if (!match || !['IF','BFN'].includes(track)) return '';

  if (compact) return studyLink(track, links[0][0], links[0][1], 'Mở bài học', 'btn btn-xs task-study-jump');
  return `<div class="study-document-links">${links.map(([id, at, label]) => studyLink(track,id,at,label)).join('')}</div>`;
}

function followStudyLink(hash) {
  const match = /^#study\/(IF|BFN)(?:\/([a-z0-9_-]+)(?:\/([a-z0-9-]+))?)?$/.exec(hash);
  if (!match) return false;
  const [, course, id, position = ''] = match;
  const file = STUDY_RESOURCES.find(item => item.id === id && item.course === course);
  if (id && !file && !(course === 'IF' && id === 'practice') && !(course === 'BFN' && id === 'rules')) return false;
  ui.route = 'study';
  ui.studyCourse = course;
  ui.studyDocument = file?.id || '';
  ui.studyPosition = position;
  if (legacyStudyResource(file)) {
    ui.readerFile = file.id;
    ui.readerPage = Number(position) || 1;
    ui.readerQuery = '';
    ui.readerMode = 'pages';
    ui.readerSheet = 0;
    ui.readerAll = true;
    state.study.fileSeen[file.id] = true;
    save();
  }
  let target = 'study-course-files';
  if (id === 'practice') {
    ui.ifSet = position.startsWith('a') ? 1 : position.startsWith('b') ? 2 : 0;
    const question = /q[1-4]$/.exec(position);
    target = question ? 'if-practice-' + question[0] : 'if-final-practice';
  } else if (id === 'rules') {
    ui.sprintOpen = new Set([...(ui.sprintOpen || []), 'exam-rules']);
    target = 'bfn-exam-rules';
  } else if (file) {
    target = 'study-document';
  }
  render(true);
  requestAnimationFrame(() => {
    const node = $(target);
    node?.scrollIntoView({block:'start'});
    if (node) {
      node.tabIndex = -1;
      node.focus({preventScroll:true});
    }
    if (legacyStudyResource(file) && STUDY_PAGE_COUNTS[file.id] && Number(position) > 1) studyGoPage(Number(position));
  });
  return true;
}

async function resourceURL(file) {
  if (!resourceURLs.has(file.id)) {
    const build = async () => {
      const dataNode = $('resource-' + file.id) || $('asset-' + file.id);
      const raw = atob(dataNode.textContent);
      const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
      const data = new Blob([bytes]);
      if (!file.gzip) return URL.createObjectURL(new Blob([data], {type:file.mime}));
      const stream = data.stream().pipeThrough(new DecompressionStream('gzip'));
      const decoded = await new Response(stream).arrayBuffer();
      return URL.createObjectURL(new Blob([decoded], {type:file.mime}));
    };
    resourceURLs.set(file.id, build().catch(error => { resourceURLs.delete(file.id); throw error; }));
  }
  return resourceURLs.get(file.id);
}

async function hydrateSelectedResource() {
  const box = $('resource-frame');
  if (!box) return;
  const file = STUDY_RESOURCES.find(item => item.id === ui.studyDocument);
  const position = ui.studyPosition || '';
  const status = $('resource-status');
  try {
    const url = await resourceURL(file);
    if (!box.isConnected) return;
    const frame = document.createElement('iframe');
    frame.title = file.label;
    $('resource-download').href = url;
    $('resource-actions').hidden = false;
    if (file.ext === 'pdf') {
      frame.src = url + (Number(position) > 1 ? '#page=' + Number(position) : '');
      $('resource-tab').href = frame.src;
    } else {
      frame.setAttribute('sandbox','allow-scripts');
      const source = JSON.parse($('preview-' + file.id).textContent);
      const targetScript = position ? `<script>
      addEventListener('load', () => document.getElementById(${JSON.stringify(position)})?.scrollIntoView());
      <\/script>` : '';
      frame.srcdoc = source.replace(/<\/body>/i, targetScript + '</body>');
    }
    box.replaceChildren(frame);
    status.textContent = file.ext === 'pdf' ? 'Nếu thiết bị không hiện PDF trong khung, bấm Mở PDF ở tab mới hoặc tải file gốc.' : '';
  } catch (error) {
    if (box.isConnected) status.textContent = 'Trình duyệt chưa mở được tài liệu này. Hãy mở Workspace trong Chrome hoặc Edge phiên bản mới.';
  }
}

function renderInlineExcel(){const sheets=studyExcelData();const i=Math.max(0,Math.min(ui.readerSheet,sheets.length-1));const sheet=sheets[i];return `<div class="reader-top"><div style="min-width:0;flex:1"><div class="study-kicker">✦ EXCEL TRỰC TIẾP TRONG HTML</div><h3>Exercise & Solution · Bảng tính</h3><p class="hintline">Hiển thị mọi sheet bằng bảng cuộn, xem dữ liệu và đáp án đã lưu. Đây là bản xem, không thay thế công thức Excel.</p></div><button class="study-control" data-act="asset-download" data-id="bm_excel">↓ Tải XLSX gốc</button></div><div class="excel-subnav">${sheets.map((s,j)=>`<button class="${j===i?'active':''}" data-act="reader-sheet" data-value="${j}">${esc(s.n)}</button>`).join('')}</div><div class="excel-viewport" id="reader-scroll">${renderExcelTable(sheet)}</div><div class="reader-pages-note">Dữ liệu và giá trị tính sẵn được lấy từ file Excel gốc; muốn sửa số đầu vào và chạy lại công thức, tải file XLSX. Không tự động làm mới công thức trong trang HTML.</div>`}
function renderLibrary(){const id=ui.readerFile;return `<div class="section-head" id="study-reader"><h2>📖 Tài liệu mở sẵn, ngay tại đây</h2><span class="pill done">5/5 file · offline</span></div><div class="study-inline-note" style="margin-bottom:13px">✨ Tui giữ nguyên trang gốc để bà xem hình và bảng. Chạm tên tài liệu bên cạnh sẽ đổi nội dung ngay trong khung này. <b>Không tải xuống, không mở tab khác.</b> Bộ lời giải có vài thông số khác đề, cần đối chiếu kỹ.</div><div class="study-reader-wrap">${renderStudyFileNav()}<div class="card study-reader-panel" id="reader-panel">${id==='bm_excel'?renderInlineExcel():renderInlinePdf(id)}</div></div>`}
function renderStudyPath(){return `<div class="section-head" id="study-roadmap"><h2>🧩 Lộ trình BM · mở sẵn từng bước</h2><span class="pill done" id="study-done-pill">${Object.values(state.study.unitDone).filter(Boolean).length}/${UNITS.length} đã xong</span></div><div class="unitgrid inline-units">${UNITS.map(u=>{const done=!!state.study.unitDone[u.id],scheduled=state.tasks.some(t=>t.studyUnit===u.id&&t.status!=='done');return `<article class="card study-unit-inline"><div class="unithead"><span class="unitnum">${esc(u.ch)}</span>${done?'<span class="pill done">✓ Đã học</span>':`<span class="pill">${u.duration} phút</span>`}</div><strong>${esc(u.title)}</strong><p class="unitintro">${esc(u.desc)}</p><ul class="study-steps">${u.steps.map((s,i)=>`<li><span class="step-dot">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ul><div class="selfcheck"><b>🧠 Tự kiểm tra:</b> ${esc(u.q)}</div><span class="reader-lesson-source">${esc(u.src)}</span><div class="mini-actions"><button class="btn btn-soft btn-xs" data-act="reader-unit" data-id="${u.id}">📖 Mở đúng trang</button><button class="btn btn-xs" data-act="unit-add-direct" data-id="${u.id}" ${scheduled?'disabled':''}>${scheduled?'✓ Đã có task':'＋ Thêm to-do'}</button><button class="btn ${done?'btn-soft':'btn-primary'} btn-xs" data-act="unit-done-inline" data-id="${u.id}">${done?'↶ Học lại':'✓ Đã học'}</button></div></article>`}).join('')}</div>`}
function renderCards(){const f=FLASH[ui.flashIndex%FLASH.length];return `<div class="section-head" id="study-flash"><h2>🃏 Flashcards · ôn ngay trên trang</h2><span class="pill">Thẻ ${ui.flashIndex+1}/${FLASH.length}</span></div><div class="card flashbox" data-act="flip" tabindex="0" role="button"><div class="overline">${ui.flashFlip?'ĐÁP ÁN · TỰ CHẤM':'CÂU HỎI · HÃY THỬ NHỚ'}</div><h3>${ui.flashFlip?'Đáp án tham khảo ✨':esc(f.q)}</h3>${ui.flashFlip?`<p>${esc(f.a)}</p><span class="pill">${esc(f.source)}</span>`:'<p>Tự trả lời trước khi chạm để lật nhé ♡</p>'}<span class="pill">${ui.flashFlip?'↶ Xem câu hỏi':'♡ Lật xem đáp án'}</span></div><div class="flashbar"><button class="btn" data-act="flash-prev">${icon('back',15)} Trước</button><button class="btn btn-primary" data-act="flash-next">Tiếp ${icon('arrow',15)}</button></div><p class="hintline" style="margin-top:12px">Flashcards là câu hỏi học tập tóm lược từ tài liệu, không phải đáp án chính thức. Tất cả hoạt động ngay trong HTML.</p>`}
function refreshStudyReader(){const el=$('study-library-wrap');if(el){el.innerHTML=renderLibrary();hydrateStudyReader()}}
function refreshStudyRoadmap(){const el=$('study-roadmap-wrap');if(el)el.innerHTML=renderStudyPath();const pct=$('study-pct-pill');if(pct)pct.textContent=studyPct()+'% lộ trình'}
function refreshStudyFlash(){const el=$('study-flash-wrap');if(el)el.innerHTML=renderCards()}
function hydrateStudyReader(){if(pageObserver){pageObserver.disconnect();pageObserver=null;}if(ui.readerFile==='bm_excel'||ui.readerMode!=='pages')return;const scroller=$('reader-scroll');const imgs=Array.from(document.querySelectorAll('#reader-panel .pdf-native-img'));if(!scroller||!imgs.length)return;
 const load=img=>{if(img.dataset.loaded==='1')return;const n=Number(img.dataset.index);const pg=studyPdfData(ui.readerFile)[n];if(pg){img.src='data:image/webp;base64,'+pg.i;img.dataset.loaded='1';}};
 if(typeof IntersectionObserver!=='undefined'){pageObserver=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){load(e.target);pageObserver.unobserve(e.target)}}},{root:scroller,rootMargin:'550px 0px',threshold:0.01});imgs.forEach(img=>pageObserver.observe(img));}
 else imgs.forEach(load);
}
function selectStudyReaderFile(id,page){if(!FILES.some(f=>f.id===id))return;ui.readerFile=id;ui.readerPage=page||1;ui.readerQuery='';ui.readerMode='pages';ui.readerSheet=0;ui.readerAll=true;state.study.fileSeen[id]=true;save();refreshStudyReader();if(page&&page>1&&id!=='bm_excel')studyGoPage(page);}
function studyGoPage(n){const docid=ui.readerFile;if(docid==='bm_excel')return;const max=STUDY_PAGE_COUNTS[docid],p=Math.min(max,Math.max(1,Number(n)||1));ui.readerPage=p;if(!ui.readerAll){refreshStudyReader();return;}const target=$('reader-panel')?.querySelector(`[data-page-section="${p}"]`),scroll=$('reader-scroll');if(target&&scroll){scroll.scrollTo({top:target.offsetTop-scroll.offsetTop,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}const field=$('reader-goto');if(field)field.value=String(p);
 const prev=$('reader-panel')?.querySelector('[data-act="reader-prev"]'),next=$('reader-panel')?.querySelector('[data-act="reader-next"]');if(prev)prev.disabled=p===1;if(next)next.disabled=p===max;
}
window.studyGoFromInput=function(v){studyGoPage(v)};
window.studyFind=function(v){ui.readerQuery=v;const out=$('reader-hits');if(out)out.innerHTML=readerSearchResults()};
function studyToggleUnit(id){state.study.unitDone[id]=!state.study.unitDone[id];save();refreshStudyRoadmap();if(state.study.unitDone[id]){confetti();mascotCheer();toast('Hoàn thành một chủ đề! DDOS phát hoa 🌸')}else toast('Đã đưa chủ đề về trạng thái đang học')}
function studyQuickSchedule(id){const u=UNITS.find(x=>x.id===id);if(!u)return;if(state.tasks.some(t=>t.studyUnit===id&&t.status!=='done')){toast('Đã có trong to-do rồi nè');return;}state.tasks.push({id:uid(),t:`Ôn BM ${u.ch}: ${u.title}`,track:'BFN',date:dateISO(),time:'',duration:u.duration,pri:4,status:'todo',reminder:30,archived:false,studyUnit:id,note:u.steps.map((s,i)=>(i+1)+'. '+s).join('\n')+'\nNguồn: '+u.src});save();refreshStudyRoadmap();toast('Đã thêm vào to-do hôm nay ♡')}
function renderFocus(){const total=timer.mode*60,progress=360*(1-timer.remaining/total),min=Math.floor(timer.remaining/60),sec=timer.remaining%60;return `<div class="pageintro"><div><h1>Focus, little by little 🌸</h1><p>Một việc một lần. DDOS sẽ ở đây cùng bạn.</p></div><span class="pill done">${todayFocused()} phút hôm nay</span></div><div class="focus-layout"><div class="card focuscard"><div class="modepick"><button class="${timer.mode===25?'active':''}" data-act="mode" data-value="25">25 phút</button><button class="${timer.mode===50?'active':''}" data-act="mode" data-value="50">50 phút</button><button class="${timer.mode===5?'active':''}" data-act="mode" data-value="5">Nghỉ 5 phút</button></div><div class="timerring" id="timerring" style="--angle:${progress}deg"><div class="timeinner"><strong id="timertext">${z(min)}:${z(sec)}</strong><span>${timer.mode===5?'Rest & recharge':'Chỉ cần tiến bộ một chút ✨'}</span></div></div><div class="focus-actions"><button class="btn btn-primary" data-act="timer-toggle" id="timer-btn">${icon(timer.running?'pause':'play',15)} ${timer.running?'Tạm dừng':'Bắt đầu'}</button><button class="btn" data-act="timer-reset">${icon('refresh',15)} Đặt lại</button></div><label class="focuschoose">Mình đang tập trung vào việc nào?<select id="focus-task-select" onchange="window.chooseFocusTask(this.value)"><option value="">Chưa gắn task cụ thể</option>${openTasks().map(t=>`<option value="${esc(t.id)}" ${timer.taskId===t.id?'selected':''}>${esc(t.t).slice(0,95)}</option>`).join('')}</select></label><p class="hintline" style="margin-top:14px;text-align:center">Timer chỉ chạy khi trang còn mở. Hết phiên sẽ lưu phút vào thống kê.</p></div><div class="focusright"><div class="card cardpad"><div class="eyebrow">TODAY'S LITTLE WINS</div><div class="kpi">${todayFocused()} <span style="font-family:var(--font);font-size:14px">phút</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,pct(todayFocused(),90))}%"></div></div><p class="hintline" style="margin:10px 0 0">Mốc tham khảo 90 phút tập trung/ngày. Không phải chỉ tiêu bắt buộc.</p><div style="display:flex;gap:11px;margin-top:18px;align-items:center">${mascot(65,'cheer')}<div class="hintline"><b style="color:var(--ink)">DDOS nhắn:</b><br>Đã tập trung thì thôi đừng so sánh năng suất với ai khác nhé ♡</div></div></div><div class="card focuslist"><div class="section-head" style="margin:0 0 6px"><h2 style="font-size:19px">🪴 Nhật ký focus</h2></div>${state.focus.records.slice(-8).reverse().map(r=>`<div class="session"><span>${esc(r.date)} · ${r.kind==='focus'?'🎯 Focus':'☕ Break'} ${r.task?'<br>'+esc(r.task).slice(0,55):''}</span><b>${r.min} phút</b></div>`).join('')||'<div class="empty">Chưa có phiên nào. Bắt đầu phiên đầu tiên nào! ✨</div>'}</div></div></div>`}
window.chooseFocusTask=v=>{timer.taskId=v;};
function nav(to){if(!['home','tasks','planner','study','focus'].includes(to))return;ui.route=to;window.scrollTo({top:0,behavior:'smooth'});render()}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const make=t.status!=='done';t.status=make?'done':'todo';t.completedAt=make?new Date().toISOString():'';save();render();if(make){confetti();mascotCheer();toast('Yay! Xong một việc rồi nè 🎉')}else toast('Đã đưa task về danh sách cần làm')}
function setTaskStatus(id,status){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(!['todo','doing','done'].includes(status))return;t.status=status;t.completedAt=status==='done'?new Date().toISOString():'';save();render();if(status==='done'){confetti();toast('Tốt lắm! Một việc nữa đã hoàn thành 🌷')}}
function renderModal(html){$('modal-content').innerHTML=html;$('modalback').hidden=false;document.body.style.overflow='hidden';ui.modal=true;setTimeout(()=>{const f=$('modal-content').querySelector('[autofocus]');if(f)f.focus()},10)}
function closeModal(){$('modalback').hidden=true;$('modal-content').innerHTML='';document.body.style.overflow='';ui.modal=false}
function modalHead(title,desc){return `<div class="modalhead"><div><h2>${title}</h2><p>${desc||''}</p></div><button class="iconbutton" data-act="close" aria-label="Đóng">${icon('close')}</button></div>`}
function openTaskForm(id='',date=''){const existing=state.tasks.find(x=>x.id===id);const t=existing||{t:'',track:'BFN',date:date||dateISO(),time:'',duration:45,pri:3,note:'',reminder:30,status:'todo',archived:false};renderModal(`${modalHead(existing?'Sửa task ✏️':'Một việc mới 🌷','Viết ngắn gọn việc cần làm, phần còn lại để DDOS lo.')}
<form id="task-form"><input type="hidden" name="id" value="${esc(t.id||'')}"><div class="field"><label for="f-title">Việc cần làm <span style="color:var(--roseink)">*</span></label><input id="f-title" name="title" maxlength="250" value="${esc(t.t)}" placeholder="Ví dụ: Làm lại bài 9.1 Duration Gap" required autofocus></div>
<div class="formgrid"><div class="field"><label for="f-track">Mảng</label><select id="f-track" name="track">${Object.entries(COURSES).filter(([k])=>['BFN','IF','VIDEO','LIFE'].includes(k)||normalizeTrack(t.track)===k).map(([k,v])=>`<option value="${k}" ${normalizeTrack(t.track)===k?'selected':''}>${v.emoji} ${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label for="f-pri">Độ ưu tiên</label><select id="f-pri" name="priority">${[[2,'🌱 Bình thường'],[3,'✨ Quan trọng'],[5,'🔥 Rất quan trọng']].map(([n,l])=>`<option value="${n}" ${Number(t.pri)===n||Number(t.pri)===4&&n===5?'selected':''}>${l}</option>`).join('')}</select></div></div>
<div class="formgrid"><div class="field"><label for="f-date">Ngày dự kiến</label><input id="f-date" name="date" type="date" value="${esc(t.date||'')}"></div><div class="field"><label for="f-time">Giờ nhắc</label><input id="f-time" name="time" type="time" value="${esc(t.time||'')}"></div></div>
<div class="formgrid"><div class="field"><label for="f-dur">Ước tính (phút)</label><input id="f-dur" name="duration" type="number" value="${Math.max(1,Number(t.duration)||45)}" min="1" max="600"></div><div class="field"><label for="f-remind">Nhắc trước (phút)</label><select id="f-remind" name="reminder">${[[0,'Đúng giờ'],[10,'Trước 10 phút'],[30,'Trước 30 phút'],[60,'Trước 1 giờ'],[1440,'Trước 1 ngày']].map(([n,v])=>`<option value="${n}" ${Number(t.reminder??30)===n?'selected':''}>${v}</option>`).join('')}</select></div></div>
<div class="field"><label for="f-status">Trạng thái</label><select id="f-status" name="status">${[['todo','Chưa bắt đầu'],['doing','Đang làm'],['done','Đã xong']].map(([n,v])=>`<option value="${n}" ${t.status===n?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="field"><label for="f-note">Ghi chú / các bước nhỏ</label><textarea id="f-note" name="note" placeholder="Ghi đầu ra mong muốn, nguồn tài liệu, các bước cần làm...">${esc(t.note||'')}</textarea></div>
<label style="display:flex;gap:9px;align-items:center;font-size:11px;color:var(--ink2)"><input type="checkbox" name="archived" ${t.archived?'checked':''}> Lưu trữ / tạm ẩn khỏi trang Hôm nay</label><p class="noteinfo" style="margin:10px 0 0">🔔 Nhắc bằng thông báo trình duyệt chỉ hoạt động khi bạn cấp quyền và còn mở trang. Nếu đóng trang, deadline vẫn hiển thị khi mở lại.</p>
<div class="modalfoot">${existing?`<button type="button" class="btn btn-danger" data-act="delete-task" data-id="${esc(t.id)}">Xoá</button>`:''}<button type="button" class="btn" data-act="close">Huỷ</button><button class="btn btn-primary" type="submit">${existing?'Lưu thay đổi':'Tạo task ✨'}</button></div></form>`)}
function saveTaskForm(form){const f=new FormData(form);const title=String(f.get('title')||'').trim();if(!title){toast('Nhập tên việc trước nha');return}const id=String(f.get('id')||'');let t=state.tasks.find(x=>x.id===id);if(!t){t={id:uid(),createdAt:new Date().toISOString()};state.tasks.push(t)}const prev=t.status;t.t=title;t.track=normalizeTrack(String(f.get('track')));t.pri=Number(f.get('priority'))||3;t.date=String(f.get('date')||'');t.time=String(f.get('time')||'');t.duration=Number(f.get('duration'))||45;t.reminder=Number(f.get('reminder'))||0;t.note=String(f.get('note')||'');t.status=String(f.get('status')||'todo');t.archived=f.has('archived');if(t.status==='done'&&prev!=='done')t.completedAt=new Date().toISOString();if(t.status!=='done')t.completedAt='';save();closeModal();render();toast('Đã lưu task vào workspace 💜')}
function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(!confirm(`Xoá task "${t.t}"?`))return;state.tasks=state.tasks.filter(x=>x.id!==id);save();closeModal();render();toast('Đã xoá task')}
function quickAdd(){const el=$('quick-task');const raw=el?.value.trim()||'';if(!raw){el?.focus();toast('Gõ tên việc đã nha ♡');return}let text=raw,track='BFN',d=dateISO(),pri=3;let k=text.match(/#(BFN|BF|IF|IELTS|MACRO|ZH|NSI|VIDEO|DA|LIFE)\b/i);if(k){track=normalizeTrack(k[1].toUpperCase());text=text.replace(k[0],'').trim()}if(/\bmai\b/i.test(text)){d=addDays(d,1);text=text.replace(/\bmai\b/ig,'').trim()}if(/!/g.test(text)){pri=5;text=text.replace(/!/g,'').trim()}text=text.replace(/\s+/g,' ').trim();if(!text)return;state.tasks.push({id:uid(),t:text,track,date:d,time:'',duration:45,pri,status:'todo',reminder:30,archived:false,createdAt:new Date().toISOString()});save();render();toast('Thêm thành công! Để DDOS nhớ hộ bạn nha 🌷')}

function videoToTask(id){const v=state.videos.find(x=>x.id===id);if(!v)return;const title='Video: '+v.t;const exists=state.tasks.some(t=>t.t===title&&t.status!=='done');if(exists){toast('Video này đã có trong to-do rồi nè');return}state.tasks.push({id:uid(),t:title,track:'VIDEO',date:dateISO(),pri:3,status:'todo',time:'',duration:90,reminder:30,archived:false,note:v.idea||''});save();render();toast('Đã đưa ý tưởng video vào to-do 🎬')}
function studyUnitModal(id){const u=UNITS.find(x=>x.id===id);if(!u)return;const done=!!state.study.unitDone[u.id];renderModal(`${modalHead(`${u.ch} · ${u.title}`,'Lộ trình tự ôn từ tài liệu BM được đính kèm')}<p class="noteinfo">${esc(u.desc)}</p><div class="divider"></div><div class="eyebrow">3 BƯỚC NÊN LÀM</div><ol style="font-size:12px;line-height:2;color:var(--ink2);padding-left:21px">${u.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="card" style="padding:14px 16px;background:var(--surface2);margin:14px 0"><b style="font-size:12px">Tự kiểm tra trước khi sang chủ đề khác</b><p style="font-size:12px;margin:7px 0 0;line-height:1.8">${esc(u.q)}</p></div><p class="noteinfo">Nguồn: ${esc(u.src)} · Dự kiến ${u.duration} phút. Số phút chỉ là gợi ý, không phải thời gian bắt buộc.</p><div class="modalfoot"><button class="btn" data-act="unit-schedule" data-id="${u.id}">${icon('calendar',15)} Đưa vào to-do</button><button class="btn ${done?'btn-soft':'btn-primary'}" data-act="unit-done" data-id="${u.id}">${done?'↶ Chưa ôn xong':'✓ Đánh dấu đã ôn'}</button></div>`)}
function scheduleUnit(id){const u=UNITS.find(x=>x.id===id);if(!u)return;closeModal();openTaskForm('',dateISO());const form=$('task-form');if(form){form.elements.title.value=`Ôn BM ${u.ch}: ${u.title}`;form.elements.track.value='BFN';form.elements.duration.value=u.duration;form.elements.note.value=u.steps.map((x,i)=>(i+1)+'. '+x).join('\n')+'\nNguồn: '+u.src}toast('Đã tạo nháp task học, bạn chọn ngày rồi lưu nhé')}
function doneUnit(id){state.study.unitDone[id]=!state.study.unitDone[id];save();closeModal();render();if(state.study.unitDone[id]){confetti();mascotCheer();toast('Xong một chủ đề BM rồi, tuyệt vời! 🎓')}else toast('Đã đưa chủ đề về trạng thái đang ôn')}
function assetOpen(id,download){const meta=FILES.find(x=>x.id===id),elem=$('asset-'+id);if(!meta||!elem){toast('Không tìm thấy file đính kèm');return}try{const data=atob(elem.textContent.replace(/\s+/g,''));const chunks=[];const size=65536;for(let i=0;i<data.length;i+=size){const sub=data.slice(i,i+size);const a=new Uint8Array(sub.length);for(let j=0;j<sub.length;j++)a[j]=sub.charCodeAt(j);chunks.push(a)}const type=meta.ext==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';const url=URL.createObjectURL(new Blob(chunks,{type}));const a=document.createElement('a');a.href=url;a.download=meta.original;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),180000);state.study.fileSeen[id]=true;save();if(ui.route==='study')render();toast(download?'Đang lưu file xuống máy 📁':'Đã mở tài liệu 📖')}catch(e){console.error(e);toast('Không mở được file trong trình duyệt này. Thử tải bản ZIP để dùng nhé')}}
function notificationsModal(){const items=alerts(),ex=examUpcoming();renderModal(`${modalHead('Nhắc việc 🔔','Những việc gần hạn và mốc thi đang tới.')}<div class="notebanner">Tất cả nhắc hạn đều hiển thị trong app. Thông báo pop-up chỉ có thể xuất hiện khi trang đang mở và trình duyệt cho phép.</div>${items.length?items.map(t=>`<div class="reminditem"><div class="remindbubble">🔔</div><div style="flex:1"><strong>${esc(t.who)}</strong><p>${esc(t.when)}</p></div><button class="btn btn-xs" data-act="edit" data-id="${esc(t.id)}">Xem</button></div>`).join(''):'<p class="hintline">Hiện không có công việc gần hạn.</p>'}<div class="divider"></div><div class="eyebrow">LỊCH THI</div>${ex.map(e=>`<div class="reminditem"><div class="remindbubble">🎓</div><div style="flex:1"><strong>${esc(e.name)}</strong><p>${longDate(e.date)} ${e.verified?'· Đã xác nhận':'· Cần kiểm tra lại'}</p></div><button class="btn btn-xs" data-act="edit-exam" data-id="${esc(e.id)}">Sửa</button></div>`).join('')}<div class="modalfoot"><button class="btn btn-primary" data-act="enable-notif">${icon('bell',15)} Bật thông báo</button><button class="btn" data-act="close">Đóng</button></div>`)}
function examModal(id){const e=state.exams.find(x=>x.id===id)||{id:uid(),name:'',short:'',date:dateISO(),time:'',verified:false};renderModal(`${modalHead('Cập nhật mốc thi 🎓','Chỉ đánh dấu xác nhận sau khi kiểm tra Ultra / thông báo trường.')}<form id="exam-form"><input type="hidden" name="id" value="${esc(e.id)}"><div class="field"><label>Tên mốc</label><input name="name" value="${esc(e.name)}" required autofocus></div><div class="formgrid"><div class="field"><label>Ngày</label><input name="date" type="date" value="${esc(e.date)}" required></div><div class="field"><label>Giờ</label><input name="time" type="time" value="${esc(e.time||'')}"></div></div><label style="font-size:12px;display:flex;gap:8px;align-items:center"><input name="verified" type="checkbox" ${e.verified?'checked':''}> Đã xác nhận với nhà trường</label><div class="modalfoot"><button class="btn" data-act="close" type="button">Huỷ</button><button class="btn btn-primary" type="submit">Lưu mốc thi</button></div></form>`)}
function saveExam(form){const f=new FormData(form);const id=String(f.get('id'));let e=state.exams.find(x=>x.id===id);if(!e){e={id};state.exams.push(e)}e.name=String(f.get('name')||'').trim();e.short=e.name;e.date=String(f.get('date'));e.time=String(f.get('time'));e.verified=f.has('verified');save();closeModal();render();toast('Đã cập nhật lịch thi')}
function settingsModal(){const later=state.tasks.filter(t=>t.deferredToLater).length,older=state.tasks.filter(t=>t.closedByExamPhase).length;renderModal(`${modalHead('Cài đặt NSI ⚙️','Giai đoạn hiện tại: Exam Sprint · dữ liệu lưu trên máy của bà.')}<div class="notebanner">🌷 Bà đã xác nhận mọi task giai đoạn trước xong; NSI chuyển chúng sang lưu trữ. Việc IELTS/tiếng Trung để sau được giữ nguyên trạng thái chờ, không hiện ở hiện tại.</div>
<div class="eyebrow">LỊCH QUAY CỐ ĐỊNH</div><p class="hintline">Mặc định YouTube 3 ngày × 90 phút; TikTok 1 ngày × 150 phút. Các buổi xuất hiện tự động trong lịch tuần.</p><button class="btn btn-primary btn-xs" data-act="video-open-settings">${icon('calendar',14)} Sửa lịch video hằng tuần</button>
<div class="divider"></div><div class="eyebrow">NHẬT KÝ GIAI ĐOẠN CŨ</div><p class="hintline">${older} task cũ được lưu trữ · ${later} task/mục tiêu học hẹn sau. Bà có thể xem trong tab Công việc → Giai đoạn cũ.</p><button class="btn btn-xs" data-act="show-archive">Xem toàn bộ lịch sử</button>
<div class="divider"></div><div class="eyebrow">SAO LƯU DỮ LIỆU</div><p class="hintline">NSI lưu trong localStorage theo trình duyệt. File HTML không tự đồng bộ dữ liệu giữa các máy. Trước khi đổi máy hoặc xóa cache, hãy xuất JSON.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-xs" data-act="export">${icon('download',14)} Xuất backup JSON</button><label class="btn btn-xs" for="json-import" style="cursor:pointer">${icon('import',14)} Nhập backup</label><input id="json-import" type="file" accept=".json,application/json" style="display:none" onchange="window.importFile(this)"></div>
<div class="divider"></div><div class="eyebrow">MỐC THI (TỪ STUDY OS CŨ)</div>${state.exams.map(e=>`<div class="reminditem"><div style="flex:1"><strong>${esc(e.name)}</strong><p>${longDate(e.date)} ${e.verified?'· đã xác nhận':'· cần xác nhận với trường'}</p></div><button class="btn btn-xs" data-act="edit-exam" data-id="${esc(e.id)}">Sửa</button></div>`).join('')}<div style="margin-top:9px"><button class="btn btn-xs" data-act="edit-exam">+ Thêm mốc thi</button></div>
<div class="divider"></div><div class="eyebrow">TỪ STUDY OS WEBSITE CŨ</div><p class="hintline">Có thể nhập JSON từ Study OS cũ mà không đưa các việc đã hoàn tất quay lại dashboard.</p><button class="btn btn-xs" data-act="migrate" ${!legacyAvailable()?'disabled':''}>Nhập dữ liệu từ bộ nhớ website cũ</button>
<div class="divider"></div><div class="eyebrow">GIAO DIỆN</div><button class="btn btn-xs" data-act="theme">${icon('moon',14)} Đổi sáng/tối</button>`)}
function switchTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem(STORAGE+'-theme',next)}catch(e){}toast(next==='dark'?'Đã chuyển sang chế độ tối 🌙':'Đã chuyển sang chế độ sáng ☀️');if(ui.modal)settingsModal()}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`NSI_Exam_Studio_Backup_${dateISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Đã xuất file sao lưu JSON')}
function normalizeImported(t){return {id:String(t.id||uid()),t:String(t.t||t.title||'Việc không tên'),track:normalizeTrack(t.track||t.subject||'LIFE'),date:String(t.date||''),time:String(t.time||((Number.isFinite(t.start)&&t.start>=0)?`${z(Math.floor(t.start/60))}:${z(t.start%60)}`:'')),duration:Number(t.duration||t.dur)||45,pri:Number(t.pri||t.priority)||3,status:t.status==='done'||t.done?'done':t.status==='doing'?'doing':'todo',reminder:Number(t.reminder??30),note:String(t.note||''),archived:!!t.archived||!!(t.date&&dd(t.date,dateISO())>14&&!t.done&&t.status!=='done'),imported:true}}
function mergeOld(old){if(!old||!Array.isArray(old.tasks))throw Error('Dữ liệu không có danh sách tasks');let n=0;for(const raw of old.tasks){const t=normalizeImported(raw);const idx=state.tasks.findIndex(x=>x.id===t.id);if(idx>=0){state.tasks[idx]={...state.tasks[idx],...t}}else{state.tasks.push(t);n++}}for(const v of (old.videos||[])){if(!state.videos.some(x=>x.id===v.id))state.videos.push(v)}for(const x of (old.assess||[])){if(!x.due||!(/final/i.test(x.title||'')))continue;const id=x.sub==='BF'||x.sub==='BFN'?'bf-final':x.sub==='IF'?'if-final':null;if(!id)continue;const oldExam=state.exams.find(z=>z.id===id);if(oldExam){oldExam.date=x.due;oldExam.time=x.dueTime||'';oldExam.verified=false}}state.oldSnapshot=old;state.importedLegacy=true;for(const t of state.tasks.filter(x=>x.imported&&!x.examSprint)){t.archived=true;t.closedByExamPhase=true;if(['IELTS','ZH','MACRO','DA'].includes(normalizeTrack(t.track)))t.deferredToLater=true;else{t.status='done';t.completedAt=t.completedAt||new Date().toISOString()}}save();render();toast(`Đã chuyển ${n} task mới từ bản cũ, giữ nguyên task đã có`)}
window.importFile=function(el){const file=el.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(String(reader.result));if(data.workspaceVersion&&Array.isArray(data.tasks)){if(!confirm('Khôi phục backup này sẽ thay thế dữ liệu hiện tại. Bạn đồng ý?'))return;state=safeState(data);installExamPhase();installStudySprint();save();closeModal();render();toast('Đã khôi phục backup và chế độ ôn thi NSI')}else if(Array.isArray(data.tasks)){mergeOld(data);closeModal();render()}else{throw Error('Không đúng định dạng file JSON')}}catch(e){toast('Không nhập được file: '+e.message)}};reader.readAsText(file,'utf-8')};
function migrateOld(){try{const raw=localStorage.getItem('son-study-os-v6');if(!raw){toast('Không tìm thấy dữ liệu cũ trên website này');return}const v=JSON.parse(raw);mergeOld(v);closeModal()}catch(e){toast('Dữ liệu cũ không đọc được: '+e.message)}}
function enableNotifications(){if(!('Notification' in window)){toast('Trình duyệt này chưa hỗ trợ thông báo');return}if(!window.isSecureContext){toast('Bật nhắc pop-up cần HTTPS/localhost. Trong file HTML riêng, dùng danh sách nhắc trong app nhé.');return}Notification.requestPermission().then(p=>{toast(p==='granted'?'Đã bật thông báo khi trang đang mở 🔔':'Trình duyệt chưa cấp quyền thông báo')}).catch(()=>toast('Không bật được quyền thông báo'))}
function checkNotifications(){if(typeof Notification==='undefined'||Notification.permission!=='granted')return;const now=Date.now();for(const t of openTasks()){if(!t.date||!t.time)continue;const when=new Date(t.date+'T'+t.time+':00').getTime();if(!Number.isFinite(when))continue;const n=when-(Number(t.reminder)||0)*60000;const key=t.id+':'+t.date+':'+t.time;state.notified=state.notified||{};if(now>=n&&now<=n+120000&&!state.notified[key]){try{new Notification('DDOS nhắc bạn nè 🔔',{body:t.t,tag:key});state.notified[key]=true;save()}catch(e){}}}}
function updateTimer(){const ring=$('timerring'),lab=$('timertext');if(ring){ring.style.setProperty('--angle',360*(1-timer.remaining/(timer.mode*60))+'deg')}if(lab)lab.textContent=`${z(Math.floor(timer.remaining/60))}:${z(timer.remaining%60)}`;if(timer.running)document.title=`${z(Math.floor(timer.remaining/60))}:${z(timer.remaining%60)} · NSI Focus`;else document.title='NSI · Exam Sprint'}
function timerTick(){if(!timer.running)return;const elapsed=Math.floor((Date.now()-timer.tickAt)/1000);if(elapsed<1)return;timer.remaining=Math.max(0,timer.remaining-elapsed);timer.tickAt=Date.now();updateTimer();if(timer.remaining===0){timer.running=false;const t=state.tasks.find(x=>x.id===timer.taskId);if(timer.mode!==5){state.focus.records.push({date:dateISO(),min:timer.mode,kind:'focus',task:t?.t||''});save();confetti();mascotCheer();toast('Hoàn thành một phiên tập trung! DDOS tự hào về bạn 💜')}else toast('Đã nghỉ xong. Sẵn sàng quay lại nhé 🌷');if(typeof Notification!=='undefined'&&Notification.permission==='granted'){try{new Notification('DDOS ⏰',{body:timer.mode===5?'Đã nghỉ xong!':'Xong phiên focus rồi, bạn giỏi lắm!'})}catch(e){}}render()}}
function timerToggle(){timer.running=!timer.running;timer.tickAt=Date.now();render();toast(timer.running?'Chúc phiên tập trung thật mượt mà 🌱':'Đã tạm dừng timer')}
function timerReset(){timer.running=false;timer.remaining=timer.mode*60;render()}
function timerMode(n){n=Number(n);if(![5,25,50].includes(n))return;timer.running=false;timer.mode=n;timer.remaining=n*60;render()}
function eventClick(e){if(e.target.closest('a'))return;const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,v=el.dataset.value;e.preventDefault();switch(a){case'if-practice':followStudyLink('#study/IF/practice');break;case'if-set':ui.ifSet=Number(v);$('if-final-practice').outerHTML=renderIfPractice();$('if-final-practice').querySelector('[aria-pressed=true]')?.focus();break;case'nav':nav(el.dataset.route);break;case'add':openTaskForm();break;case'add-date':openTaskForm('',el.dataset.date);break;case'edit':openTaskForm(id);break;case'toggle':toggleTask(id);break;case'setstatus':setTaskStatus(id,el.dataset.status);break;case'quick-add':quickAdd();break;case'focus-top':focusTop();break;case'focus-task':focusTop(id);break;case'filter':ui.filter=v;render();break;case'toggle-view':ui.view=ui.view==='list'?'board':'list';render();break;case'show-archive':ui.filter='archive';ui.route='tasks';if(ui.modal)closeModal();render();break;case'week-prev':ui.week=addDays(ui.week,-7);render();break;case'week-next':ui.week=addDays(ui.week,7);render();break;case'week-today':ui.week=monday(dateISO());render();break;case'study-tab':ui.studyTab=v;render();break;case'reader-file':followStudyLink('#study/BFN/'+id);break;case'reader-mode':ui.readerMode=v;refreshStudyReader();break;case'reader-all':ui.readerAll=!ui.readerAll;refreshStudyReader();break;case'reader-prev':studyGoPage(ui.readerPage-1);break;case'reader-next':studyGoPage(ui.readerPage+1);break;case'reader-zoom-in':ui.readerZoom=Math.min(160,ui.readerZoom+20);refreshStudyReader();break;case'reader-zoom-out':ui.readerZoom=Math.max(75,ui.readerZoom-20);refreshStudyReader();break;case'reader-sheet':ui.readerSheet=Number(v)||0;refreshStudyReader();break;case'reader-hit':studyGoPage(Number(el.dataset.page)||1);break;case'reader-unit':followStudyLink('#study/BFN/bm_questions/'+studyUnitLink(id));break;case'unit-add-direct':studyQuickSchedule(id);break;case'unit-done-inline':studyToggleUnit(id);break;case'unit':studyUnitModal(id);break;case'unit-schedule':scheduleUnit(id);break;case'unit-done':doneUnit(id);break;case'flip':ui.flashFlip=!ui.flashFlip;refreshStudyFlash();break;case'flash-next':ui.flashIndex=(ui.flashIndex+1)%FLASH.length;ui.flashFlip=false;refreshStudyFlash();break;case'flash-prev':ui.flashIndex=(ui.flashIndex+FLASH.length-1)%FLASH.length;ui.flashFlip=false;refreshStudyFlash();break;case'asset-open':selectStudyReaderFile(id);break;case'asset-download':assetOpen(id,true);break;case'video-done':toggleVideoDone(id,el.dataset.date);break;case'video-skip':toggleVideoSkip(id,el.dataset.date);break;case'video-edit':videoEditModal(id);break;case'video-open-settings':videoScheduleModal();break;case'video-task':videoToTask(id);break;case'mode':timerMode(v);break;case'timer-toggle':timerToggle();break;case'timer-reset':timerReset();break;case'settings':settingsModal();break;case'close':closeModal();break;case'delete-task':deleteTask(id);break;case'reminders':notificationsModal();break;case'enable-notif':enableNotifications();break;case'edit-exam':examModal(id);break;case'theme':switchTheme();break;case'export':exportBackup();break;case'migrate':migrateOld();break;case'mascot':mascotCheer();toast(['Bạn đang làm tốt lắm! 🌷','Từng bước nhỏ đều đáng tự hào ♡','Để DDOS nhắc những việc quan trọng cho bạn 💜'][Math.floor(Math.random()*3)]);break;default:break}}
document.addEventListener('click',eventClick);
document.addEventListener('click', event => {
  const link = event.target.closest('a[data-study-link]');
  if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  if (followStudyLink(link.hash)) {
    event.preventDefault();
    if (location.hash !== link.hash) history.pushState(null,'',link.hash);
  }
});
window.addEventListener('hashchange', () => followStudyLink(location.hash));

document.addEventListener('submit',e=>{if(e.target.getAttribute('id')==='task-form'){e.preventDefault();saveTaskForm(e.target)}if(e.target.getAttribute('id')==='exam-form'){e.preventDefault();saveExam(e.target)}if(e.target.getAttribute('id')==='video-schedule-form'){e.preventDefault();saveVideoForm(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeModal();return}if(e.key==='Enter'&&e.target.id==='quick-task'){e.preventDefault();quickAdd();return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openTaskForm();return}if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey){openTaskForm()}});
$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))closeModal()});
$('top-add').addEventListener('click',()=>openTaskForm());
$('top-settings').addEventListener('click',settingsModal);
$('top-notifications').addEventListener('click',notificationsModal);
$('top-theme').addEventListener('click',switchTheme);
$('side-backup').addEventListener('click',settingsModal);
$('side-tip').addEventListener('click',()=>nav('focus'));
window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){try{const v=safeState(JSON.parse(e.newValue));if(v){state=v;render()}}catch(x){}}});
setInterval(timerTick,450);
setInterval(checkNotifications,30000);setInterval(checkVideoNotifications,30000);
if (!followStudyLink(location.hash)) render();checkNotifications();checkVideoNotifications();
</script>
</body></html>
